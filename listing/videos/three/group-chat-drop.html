<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — dropping my routine in the group chat (Three.js loop)</title>
    <!-- The peg-board drop: nine balls, one per friend who got the routine,
         bounce down through the pegs into five bins. The bins are named after
         the run: the fullest is the friends who joined. Loud shapes on white.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, rand, pulse, FPS, TAU, W, H, SANS, DISPLAY } = R

      const D = 10
      const FRAMES = D * FPS
      const BALLS = 9
      const BALL = 0.12
      const PEG = 0.06
      const GRAVITY = -7
      const WALL = 2.0
      const FLOOR = -1.6
      const LIP = -0.9
      const EDGES = [-2, -1.2, -0.4, 0.4, 1.2, 2]
      const T_OPEN = 8.6
      const T_RESULT = 6.6
      const START = { x: 0.13, y: 1.95, vx: 0.4, vy: -3 }
      const dropAt = (i) => i * 0.62
      const INK = '#111111'
      const PAPER = '#fffdf7'
      const LOUD = ['#ff5fa2', '#ffd400', '#00c2ff', '#7c5cff', '#ff7a1a']

      const pegs = []
      for (let r = 0; r < 6; r++) {
        const n = r % 2 ? 7 : 8
        for (let i = 0; i < n; i++) pegs.push([(i - (n - 1) / 2) * 0.5, 1.2 - r * 0.36])
      }
      /* The top of each bin wall bounces like a peg. */
      const posts = EDGES.slice(1, -1).map((x) => [x, LIP])

      /* The whole drop is worked out once, so any frame can be drawn on its
         own and every recording is the same. */
      const frames = []
      {
        const balls = []
        const SUB = 8
        const dt = 1 / (FPS * SUB)
        const bounce = (b, cx, cy, reach, spring) => {
          const dx = b.x - cx
          const dy = b.y - cy
          const d = Math.hypot(dx, dy)
          if (d >= reach || d === 0) return
          const nx = dx / d
          const ny = dy / d
          b.x = cx + nx * reach
          b.y = cy + ny * reach
          const dot = b.vx * nx + b.vy * ny
          if (dot < 0) {
            b.vx -= (1 + spring) * dot * nx
            b.vy -= (1 + spring) * dot * ny
          }
        }
        for (let f = 0; f < FRAMES; f++) {
          const t = f / FPS
          for (let i = balls.length; i < BALLS && t >= dropAt(i); i++)
            balls.push(i === 0 ? { ...START } : { x: (rand(i, 1) - 0.5) * 1.6, y: 2.4, vx: (rand(i, 2) - 0.5) * 1.2, vy: -2 })
          frames.push(balls.map((b) => [b.x, b.y]))
          const open = t >= T_OPEN
          for (let s = 0; s < SUB; s++) {
            for (const b of balls) {
              b.vy += GRAVITY * dt
              b.x += b.vx * dt
              b.y += b.vy * dt
              if (Math.abs(b.x) > WALL - BALL) {
                b.x = Math.sign(b.x) * (WALL - BALL)
                b.vx *= -0.5
              }
              for (const [px, py] of pegs) bounce(b, px, py, BALL + PEG, 0.45)
              if (open) continue
              for (const [px, py] of posts) bounce(b, px, py, BALL + 0.04, 0.3)
              if (b.y < LIP)
                for (const x of EDGES.slice(1, -1))
                  if (Math.abs(b.x - x) < BALL + 0.04) {
                    b.x = x + Math.sign(b.x - x || 1) * (BALL + 0.04)
                    b.vx *= -0.3
                  }
              if (b.y < FLOOR + BALL) {
                b.y = FLOOR + BALL
                b.vy *= -0.25
                b.vx *= 0.7
              }
            }
            if (open) continue
            for (let i = 0; i < balls.length; i++)
              for (let j = i + 1; j < balls.length; j++) {
                const a = balls[i]
                const b = balls[j]
                const dx = b.x - a.x
                const dy = b.y - a.y
                const d = Math.hypot(dx, dy)
                if (d >= BALL * 2 || d === 0) continue
                const nx = dx / d
                const ny = dy / d
                const push = (BALL * 2 - d) / 2
                a.x -= nx * push
                a.y -= ny * push
                b.x += nx * push
                b.y += ny * push
                const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny
                if (rel < 0) {
                  a.vx += rel * nx * 0.6
                  a.vy += rel * ny * 0.6
                  b.vx -= rel * nx * 0.6
                  b.vy -= rel * ny * 0.6
                }
              }
          }
        }
      }
      const binOf = (x) => Math.max(0, Math.min(4, Math.floor((x + 2) / 0.8)))
      const settled = frames[Math.round((T_OPEN - 0.1) * FPS)]
      const counts = [0, 0, 0, 0, 0]
      for (const [x] of settled) counts[binOf(x)]++
      /* Fullest bin first: it gets the first name in the list. */
      const order = [0, 1, 2, 3, 4].sort((a, b) => counts[b] - counts[a])

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'group-chat-drop',
        duration: D,
        copy: {
          en: {
            hook: ['dropping my routine', 'in the group chat'],
            result: (n) => ['1 file. 9 friends.', `${n} already in the room.`],
            bins: ['joined the room', '"next week"', 'left on read', '"what app?"', 'sent a 🔥'],
          },
          es: {
            hook: ['suelto mi rutina', 'en el grupo'],
            result: (n) => ['1 archivo. 9 amigos.', `${n} ya están en la sala.`],
            bins: ['entró a la sala', '"la otra semana"', 'dejó en visto', '"¿qué app?"', 'mandó un 🔥'],
          },
        },
        build(api) {
          const { L, ctx, px, scene } = api
          const style = (t) => ({ t, bg: INK, fg: PAPER })
          const flat = (color) => new THREE.MeshBasicMaterial({ color })

          const pegGeo = new THREE.CylinderGeometry(PEG, PEG, 0.3, 20)
          for (const [x, y] of pegs) {
            const peg = new THREE.Mesh(pegGeo, flat(INK))
            peg.rotation.x = Math.PI / 2
            peg.position.set(x, y, 0)
            scene.add(peg)
          }
          for (const x of EDGES) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(0.06, LIP - FLOOR + 0.05, 0.3), flat(INK))
            wall.position.set(x, (LIP + FLOOR) / 2, 0)
            scene.add(wall)
          }
          const floor = new THREE.Mesh(new THREE.BoxGeometry(4.06, 0.06, 0.3), flat(INK))
          scene.add(floor)

          const ballGeo = new THREE.SphereGeometry(BALL, 24, 16)
          const balls = Array.from({ length: BALLS }, (_, i) => {
            const mesh = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: LOUD[i % LOUD.length], roughness: 0.35 }))
            scene.add(mesh)
            return mesh
          })

          return {
            textStyle: 'caption',
            textY: 240,
            brand: { color: INK, alpha: 0.6, y: 1530 },
            texts: [
              { at: -1, until: T_RESULT, lines: L.hook.map(style) },
              { at: T_RESULT, until: T_OPEN + 0.6, lines: L.result(counts[order[0]]).map(style) },
              { at: T_OPEN + 0.6, until: 99, lines: L.hook.map(style) },
            ],
            shakes: [[T_OPEN, 20]],

            background(t) {
              ctx.fillStyle = PAPER
              ctx.fillRect(0, 0, W, H)
              /* Confetti shapes, each turning once per loop. */
              for (let i = 0; i < 26; i++) {
                const x = rand(i, 1) * W
                const y = rand(i, 2) * H
                const a = (t / D) * TAU * (i % 2 ? 1 : -1) + i
                ctx.save()
                ctx.translate(x + 30 * Math.cos(a), y + 30 * Math.sin(a))
                ctx.rotate(a)
                ctx.fillStyle = LOUD[i % LOUD.length]
                ctx.strokeStyle = INK
                ctx.lineWidth = 8
                ctx.globalAlpha = 0.5
                const kind = i % 3
                ctx.beginPath()
                if (kind === 0) ctx.arc(0, 0, 34, 0, TAU)
                else if (kind === 1) {
                  ctx.moveTo(-40, 34)
                  ctx.lineTo(40, 34)
                  ctx.lineTo(0, -40)
                  ctx.closePath()
                } else ctx.rect(-34, -12, 68, 24)
                ctx.fill()
                ctx.stroke()
                ctx.restore()
              }
              /* The bins, tinted. */
              const top = px(0, LIP, 0)[1]
              const bottom = px(0, FLOOR, 0)[1]
              for (let b = 0; b < 5; b++) {
                const x0 = px(EDGES[b], 0, 0)[0]
                const x1 = px(EDGES[b + 1], 0, 0)[0]
                ctx.fillStyle = LOUD[b]
                ctx.globalAlpha = 0.28
                ctx.fillRect(x0, top, x1 - x0, bottom - top)
                ctx.globalAlpha = 1
              }
            },

            pose(t) {
              const open = seg(t, T_OPEN, T_OPEN + 0.2)
              floor.position.set(0, FLOOR - 0.03, 0)
              /* The floor drops away, and is back before the loop restarts. */
              floor.scale.x = Math.max(0.001, 1 - open + seg(t, D - 0.4, D - 0.1))
              const frame = frames[Math.round(t * FPS) % FRAMES]
              balls.forEach((ball, i) => {
                ball.visible = i < frame.length
                if (ball.visible) ball.position.set(frame[i][0], frame[i][1], 0)
                ball.scale.setScalar(1)
              })
              /* The next first ball comes in along its own path, so the seam is invisible. */
              if (t > D - 0.35) {
                const a = t - D
                balls[0].visible = true
                balls[0].position.set(START.x + START.vx * a, START.y + START.vy * a + 0.5 * GRAVITY * a * a, 0)
              }
            },

            over(t) {
              const frame = frames[Math.round(t * FPS) % FRAMES]
              const now = [0, 0, 0, 0, 0]
              if (t < T_OPEN) for (const [x, y] of frame) if (y < LIP) now[binOf(x)]++
              const bottom = px(0, FLOOR, 0)[1]
              for (let b = 0; b < 5; b++) {
                const cx = px((EDGES[b] + EDGES[b + 1]) / 2, 0, 0)[0]
                const best = b === order[0]
                const name = L.bins[order.indexOf(b)]
                ctx.save()
                ctx.translate(cx, bottom + 50)
                ctx.rotate(-0.5)
                ctx.fillStyle = INK
                ctx.textAlign = 'right'
                ctx.textBaseline = 'middle'
                ctx.font = `800 30px ${SANS}`
                ctx.fillText(name, 26, 0)
                ctx.restore()
                if (!now[b]) continue
                api.big(`${now[b]}`, cx, px(0, LIP, 0)[1] - 44, {
                  size: 74,
                  fill: best && t >= T_RESULT ? LOUD[1] : PAPER,
                  stroke: INK,
                  scale: 1 + (best ? pulse(t, T_RESULT, 0.5, 22, 6) : 0),
                })
              }
            },
          }
        },
      })
    </script>
  </body>
</html>
