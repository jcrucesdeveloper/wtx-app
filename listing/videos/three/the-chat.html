<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — the chat (Three.js loop)</title>
    <!-- The text-story format: a chat between two gym friends, with the bubbles
         as objects in space. Dark, like a messages app; the address sits in the
         message field instead of on a badge.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, pop, outCubic, TAU, W, H, SANS, MONO } = R

      const D = 11
      const T_RESET = 10.1
      const PX = 400
      const FONT = 68
      const EDGE = 1.85
      const TOP = 1.72
      const ROOM = 3.15
      const GAP = 0.13
      const BLUE = '#0a84ff'
      const GREY = '#26262b'
      /* [seconds, who, what] */
      const SCRIPT = (L) => [
        [-0.3, 'them', L.m0],
        [0.9, 'me', L.m1],
        [1.8, 'me', 'file'],
        [3.0, 'them', L.m3],
        [3.9, 'me', L.m4],
        [4.9, 'them', L.m5],
        [6.0, 'me', 'room'],
        [7.2, 'them', L.m7],
        [8.3, 'me', L.m8],
      ]

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'the-chat',
        duration: D,
        copy: {
          en: {
            name: 'Alex',
            m0: 'leg day tomorrow?',
            m1: 'always. sending you the routine',
            m3: "wait… it's just a file??",
            m4: 'tap it',
            m5: "ok it's in my app already 😳",
            m7: 'joined. same countdown??',
            m8: '3… 2… 1… 🏋️',
            file: '6 exercises',
            join: 'Join my room',
          },
          es: {
            name: 'Alex',
            m0: '¿pierna mañana?',
            m1: 'siempre. te mando la rutina',
            m3: 'espera… ¿es solo un archivo??',
            m4: 'ábrelo',
            m5: 'ya está en mi app 😳',
            m7: 'dentro. ¿la misma cuenta regresiva??',
            m8: '3… 2… 1… 🏋️',
            file: '6 ejercicios',
            join: 'Únete a mi sala',
          },
        },
        build(api) {
          const { L, ctx, scene } = api
          const chat = new THREE.Group()
          scene.add(chat)
          const measure = api.makeCanvas(8, 8).getContext('2d')
          measure.font = `600 ${FONT}px ${SANS}`

          function wrap(text) {
            const lines = []
            let line = ''
            for (const word of text.split(' ')) {
              const next = line ? `${line} ${word}` : word
              if (line && measure.measureText(next).width > 2.25 * PX) {
                lines.push(line)
                line = word
              } else line = next
            }
            lines.push(line)
            return lines
          }

          function bubble(who, text) {
            const lines = wrap(text)
            const w = Math.max(...lines.map((l) => measure.measureText(l).width)) / PX + 0.34
            const h = lines.length * 0.215 + 0.2
            const mesh = api.card(w, h, who === 'me' ? BLUE : GREY, (c) => {
              c.fillStyle = '#ffffff'
              c.textBaseline = 'middle'
              c.font = `600 ${FONT}px ${SANS}`
              lines.forEach((l, i) => c.fillText(l, 0.17 * PX, (0.1 + 0.1075 + i * 0.215) * PX + 4))
            })
            return { mesh, w, h }
          }
          function fileCard() {
            const w = 2.4
            const h = 0.78
            const mesh = api.card(w, h, '#ffffff', (c, cw, ch) => {
              c.fillStyle = '#f0283c'
              c.beginPath()
              c.roundRect(0.1 * PX, 0.1 * PX, 0.58 * PX, ch - 0.2 * PX, 30)
              c.fill()
              c.fillStyle = '#ffffff'
              c.textAlign = 'center'
              c.textBaseline = 'middle'
              c.font = `800 54px ${MONO}`
              c.fillText('.wtt', 0.39 * PX, ch / 2 + 3)
              c.textAlign = 'left'
              c.fillStyle = '#0b0b10'
              c.font = `700 64px ${MONO}`
              c.fillText('leg-day.wtt', 0.8 * PX, ch / 2 - 40)
              c.fillStyle = '#6b6f80'
              c.font = `600 50px ${SANS}`
              c.fillText(L.file, 0.8 * PX, ch / 2 + 48)
            })
            return { mesh, w, h }
          }
          function roomCard() {
            const w = 2.4
            const h = 0.86
            const mesh = api.card(w, h, '#15151c', (c, cw, ch) => {
              c.fillStyle = '#ffffff'
              c.textBaseline = 'middle'
              c.font = `700 56px ${SANS}`
              c.fillText(L.join, 0.14 * PX, 0.22 * PX)
              ;[...'K7Q2MX'].forEach((ch2, i) => {
                const x = 0.14 * PX + i * 0.36 * PX
                c.fillStyle = '#ffe100'
                c.beginPath()
                c.roundRect(x, 0.4 * PX, 0.31 * PX, 0.34 * PX, 18)
                c.fill()
                c.fillStyle = '#0b0b10'
                c.textAlign = 'center'
                c.font = `800 74px ${MONO}`
                c.fillText(ch2, x + 0.155 * PX, 0.58 * PX)
                c.textAlign = 'left'
              })
            })
            return { mesh, w, h }
          }

          let below = 0
          let scrolled = 0
          const items = SCRIPT(L).map(([at, who, what]) => {
            const made = what === 'file' ? fileCard() : what === 'room' ? roomCard() : bubble(who, what)
            const item = { ...made, at, who, top: below, x: (who === 'me' ? 1 : -1) * (EDGE - made.w / 2) }
            below += made.h + GAP
            /* How much further the chat has to scroll for this one to fit. */
            const need = Math.max(0, below - ROOM)
            item.scroll = need - scrolled
            scrolled = need
            chat.add(item.mesh)
            return item
          })

          const dots = api.card(0.62, 0.36, GREY, (c, w, h) => {
            c.fillStyle = '#8e8e93'
            for (let i = 0; i < 3; i++) {
              c.beginPath()
              c.arc(w / 2 + (i - 1) * 56, h / 2, 18, 0, TAU)
              c.fill()
            }
          })
          chat.add(dots)

          return {
            texts: [],
            brand: false,

            background() {
              ctx.fillStyle = '#000000'
              ctx.fillRect(0, 0, W, H)
            },

            pose(t) {
              chat.rotation.set(0.04 * Math.sin((t / D) * 2 * TAU), 0.11 * Math.sin((t / D) * TAU), 0)
              const cleared = seg(t, T_RESET, T_RESET + 0.2)
              let scroll = 0
              for (const it of items) scroll += it.scroll * outCubic(seg(t, it.at - 0.1, it.at + 0.25))
              scroll *= 1 - cleared

              let typing = null
              items.forEach((it, i) => {
                /* The first message arrives before the loop ends. */
                const late = i === 0 && t >= T_RESET + 0.4
                const c = late ? t - D : t
                const s = pop(c, it.at) * (late ? 1 : 1 - cleared)
                it.mesh.visible = s > 0.001
                it.mesh.position.set(it.x, TOP - it.top - it.h / 2 + scroll, 0.5 * (1 - outCubic(seg(c, it.at, it.at + 0.3))))
                it.mesh.scale.setScalar(Math.max(0.001, s))
                if (it.who === 'them' && i > 0 && t >= it.at - 0.65 && t < it.at) typing = it
              })
              dots.visible = !!typing
              if (typing) {
                dots.position.set(-EDGE + 0.31, TOP - typing.top - 0.18 + scroll, 0)
                dots.scale.setScalar(1 + 0.06 * Math.sin(t * 14))
              }
            },

            over(t) {
              /* The top of a messages app, over anything that has scrolled up. */
              const fade = ctx.createLinearGradient(0, 400, 0, 470)
              fade.addColorStop(0, '#000000')
              fade.addColorStop(1, 'rgba(0,0,0,0)')
              ctx.fillStyle = '#000000'
              ctx.fillRect(-40, -40, W + 80, 440)
              ctx.fillStyle = fade
              ctx.fillRect(-40, 400, W + 80, 70)
              const face = ctx.createLinearGradient(480, 190, 600, 310)
              face.addColorStop(0, '#ff8a00')
              face.addColorStop(1, '#f0283c')
              ctx.fillStyle = face
              ctx.beginPath()
              ctx.arc(540, 250, 62, 0, TAU)
              ctx.fill()
              ctx.fillStyle = '#ffffff'
              ctx.textAlign = 'center'
              ctx.textBaseline = 'middle'
              ctx.font = `800 58px ${SANS}`
              ctx.fillText('A', 540, 254)
              ctx.font = `600 40px ${SANS}`
              ctx.fillText(`${L.name} 💪`, 540, 356)

              /* The message field, with the address where the hint goes. */
              ctx.strokeStyle = '#3a3a40'
              ctx.lineWidth = 4
              ctx.beginPath()
              ctx.roundRect(70, 1440, 800, 92, 46)
              ctx.stroke()
              ctx.fillStyle = '#6e6e76'
              ctx.textAlign = 'left'
              ctx.font = `500 40px ${SANS}`
              ctx.fillText('wtxworkout.com', 110, 1488)
            },
          }
        },
      })
    </script>
  </body>
</html>
