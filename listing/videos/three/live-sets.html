<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — training together from 2 gyms (Three.js loop)</title>
    <!-- Training with a partner: two towers of sets stack up side by side, live,
         with cheers flying between them.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, lerp, pop, pulse, inCubic, dark, tint, YELLOW, BLUE, RED, LIME, INK, WHITE, TAU } = R

      const D = 10
      const SETS = 6
      const DROP = 0.32
      const STEP = 0.34
      const FLOOR = -1.3
      /* When each set starts to fall. The first of mine starts before the loop
         ends, so a block is already in the air on frame 1. */
      const DROPS = [
        [9.8, 1.0, 2.2, 3.3, 4.4, 5.4],
        [0.4, 1.6, 2.7, 3.9, 4.9, 5.7],
      ]
      const T_LIVE = 3.3
      const T_CHEER = 5.0
      const T_DONE = 6.2
      const T_CTA = 6.5
      const T_RESET = 9.3
      const X = [-1.0, 1.0]
      /* [when, from side, emoji] */
      const CHEERS = [
        [0.85, 0, '🔥'], [2.0, 1, '💪'], [3.1, 0, '👏'], [4.25, 1, '🔥'], [5.25, 0, '💪'], [6.05, 1, '👏'],
      ]
      const CHEER_FLIGHT = 0.75
      const SHADES = [
        [RED, '#ff8a00', YELLOW, RED, '#ff8a00', YELLOW],
        [BLUE, '#06b6d4', LIME, BLUE, '#06b6d4', LIME],
      ]

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'live-sets',
        duration: D,
        /* Open a moment in: two sets down and a cheer in the air. */
        from: 1.3,
        copy: {
          en: {
            hook: [dark('TRAINING TOGETHER'), tint('FROM 2 GYMS', WHITE, RED)],
            live: [dark('EVERY SET.'), tint('LIVE.', WHITE, BLUE)],
            cheer: [dark('CHEERS'), tint('INCLUDED.', YELLOW)],
            cta: [dark("WHO'S YOUR"), tint('GYM PARTNER?', YELLOW)],
            names: ['YOU', 'ALEX'],
          },
          es: {
            hook: [dark('ENTRENANDO JUNTOS'), tint('DESDE 2 GIMNASIOS', WHITE, RED)],
            live: [dark('CADA SERIE.'), tint('EN VIVO.', WHITE, BLUE)],
            cheer: [dark('ÁNIMOS'), tint('INCLUIDOS.', YELLOW)],
            cta: [dark('¿QUIÉN ES TU'), tint('GYM BRO?', YELLOW)],
            names: ['TÚ', 'ALEX'],
          },
        },
        build(api) {
          const { L, px, scene } = api
          const blockGeo = api.slab(1.25, 0.29, 0.1, 0.7)
          const towers = X.map((x, side) => {
            const base = new THREE.Mesh(
              api.slab(1.4, 0.1, 0.05, 0.85),
              new THREE.MeshStandardMaterial({ color: 0x14141c, roughness: 0.4, metalness: 0.5 }),
            )
            base.position.set(x, FLOOR - 0.21, 0)
            scene.add(base)
            return SHADES[side].map((color) => {
              const mesh = new THREE.Mesh(blockGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.35 }))
              scene.add(mesh)
              return mesh
            })
          })
          const cheers = CHEERS.map(([, , char]) => api.emoji(char, 0.7))
          const burst = api.confetti(44, T_DONE, [0, -0.4, 0.6], 9)

          const wrap = (x) => ((x % D) + D) % D
          let now = 0
          /** Seconds since this set started to fall, wrapped around the loop. */
          const since = (side, i) => wrap(now - DROPS[side][i])
          /** Every block stands until the towers are cleared at the reset. */
          const alive = (side, i) => since(side, i) < wrap(T_RESET + 0.25 - DROPS[side][i])
          const landedCount = (side) => DROPS[side].filter((_, i) => alive(side, i) && since(side, i) >= DROP).length

          return {
            texts: [
              { at: -1, until: T_LIVE, lines: L.hook },
              { at: T_LIVE, until: T_CHEER, lines: L.live },
              { at: T_CHEER, until: T_CTA, lines: L.cheer },
              { at: T_CTA, until: T_RESET, lines: L.cta },
              { at: T_RESET + 0.15, until: 99, lines: L.hook },
            ],
            wipes: [
              { at: T_LIVE, color: BLUE, from: [284, 1100] },
              { at: T_DONE, color: RED, from: [540, 1000] },
              { at: T_RESET, color: YELLOW, from: [540, 960] },
            ],
            shakes: [...DROPS.flat().map((at) => [(at + DROP) % D, 9]), [T_DONE, 32]],
            cta: [T_CTA, T_RESET],

            pose(t) {
              now = t
              const hop = 0.4 * Math.sin(Math.PI * seg(t, T_DONE, T_DONE + 0.45))
              const gone = t < T_RESET + 0.25 ? inCubic(seg(t, T_RESET, T_RESET + 0.25)) : 0
              towers.forEach((blocks, side) =>
                blocks.forEach((block, i) => {
                  block.visible = alive(side, i)
                  if (!block.visible) return
                  const a = since(side, i)
                  const fall = inCubic(seg(a, 0, DROP))
                  let squash = pulse(a, DROP, 0.16, 26, 10)
                  for (let j = i + 1; j < SETS; j++)
                    if (alive(side, j)) squash += pulse(since(side, j), DROP, 0.07, 26, 10)
                  block.position.set(X[side], FLOOR + i * STEP + lerp(4, 0, fall) + hop, 0)
                  block.rotation.set(0, 0.35 * (side ? -1 : 1), (1 - fall) * 0.5 * (R.rand(i, side) - 0.5))
                  block.scale.set((1 + squash) * (1 - gone), (1 - squash) * (1 - gone), 1 - gone)
                }),
              )

              cheers.forEach((sprite, i) => {
                const [at, from] = CHEERS[i]
                const k = (t - at) / CHEER_FLIGHT
                sprite.visible = k > 0 && k < 1
                if (!sprite.visible) return
                const top = (side) => FLOOR + landedCount(side) * STEP + 0.2
                sprite.position.set(
                  lerp(X[from], X[1 - from], k),
                  lerp(top(from), top(1 - from), k) + 1.5 * Math.sin(Math.PI * k),
                  1.2 + 1.2 * Math.sin(Math.PI * k),
                )
                sprite.scale.setScalar(sprite.userData.size * pop(k, 0, 0.2) * (1 + 0.6 * Math.sin(Math.PI * k)))
              })
              burst(t)
            },

            over(t) {
              now = t
              X.forEach((x, side) => {
                const n = landedCount(side)
                const [lx, ly] = px(x, FLOOR + SETS * STEP + 0.55, 0)
                let s = 1
                for (let i = 0; i < SETS; i++) if (alive(side, i)) s += pulse(since(side, i), DROP, 0.18, 26, 10)
                api.label(`${L.names[side]}  ${n}/${SETS}`, lx, ly, {
                  size: 46,
                  weight: 900,
                  bg: n === SETS ? LIME : INK,
                  fg: n === SETS ? INK : WHITE,
                  scale: s,
                })
              })
              api.impact(t - T_DONE, 540, 1000)
            },
          }
        },
      })
    </script>
  </body>
</html>
