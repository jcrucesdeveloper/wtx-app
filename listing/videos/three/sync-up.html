<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — wait for them to sync up (Three.js loop)</title>
    <!-- The pendulum wave: eight plates swing at eight speeds, drift into
         chaos, and line up again on the count of three. Night sky and neon trails.
         The video opens in the chaos; the line-up lands four seconds in.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, lerp, rand, outCubic, TAU, W, H } = R

      const D = 10
      const COUNT = 8
      /* Plate k swings 6 + k times per loop, so all eight are together exactly
         once: at the seam. */
      const SWINGS = 6
      const REACH = 0.46
      const PIVOT_Y = 2.5
      const INDIGO = '#1b1147'
      const GLOW = ['#ffd166', '#ffb86b', '#ff8fa3', '#ff6fb5', '#c77dff', '#9d7bff', '#6fa8ff', '#5ee6ff']
      const length = (k) => 3.5 - k * 0.1
      const depth = (k) => 1.3 - k * 0.42
      const swing = (k, t) => REACH * Math.cos((TAU * (SWINGS + k) * t) / D)

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'sync-up',
        duration: D,
        from: 6,
        copy: {
          en: {
            hook: ['8 gym partners. 8 gyms.', 'wait for them to sync up'],
            room: ['same countdown.', 'up to 8 people in one room.'],
            send: ['send this to the one', "who's always late"],
          },
          es: {
            hook: ['8 gym bros. 8 gimnasios.', 'espera a que se sincronicen'],
            room: ['la misma cuenta regresiva.', 'hasta 8 personas en una sala.'],
            send: ['mándaselo al que', 'siempre llega tarde'],
          },
        },
        build(api) {
          const { L, ctx, px, scene } = api
          const style = (t) => ({ t, bg: INDIGO })
          const rig = new THREE.Group()
          rig.rotation.x = 0.5
          rig.position.y = -0.1
          scene.add(rig)

          const cord = new THREE.MeshBasicMaterial({ color: '#cfc8ff', transparent: true, opacity: 0.55 })
          const arms = GLOW.map((color, k) => {
            const arm = new THREE.Group()
            arm.position.set(0, PIVOT_Y, depth(k))
            const string = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, length(k), 6), cord)
            string.position.y = -length(k) / 2
            const bob = new THREE.Mesh(
              new THREE.CylinderGeometry(0.3, 0.3, 0.14, 48),
              new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.2, emissive: color, emissiveIntensity: 0.55 }),
            )
            bob.rotation.x = Math.PI / 2
            bob.position.y = -length(k)
            const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.16, 20), new THREE.MeshBasicMaterial({ color: INDIGO }))
            hub.rotation.x = Math.PI / 2
            hub.position.y = -length(k)
            arm.add(string, bob, hub)
            rig.add(arm)
            return arm
          })
          for (const x of [-0.5, 0.5]) {
            const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 3.6, 8), cord)
            rail.rotation.x = Math.PI / 2
            rail.position.set(x * 0.0, PIVOT_Y, depth(3.5))
            rig.add(rail)
          }

          const probe = new THREE.Vector3()
          /** Where plate k is on the frame at a given moment. */
          function spot(k, t) {
            const a = swing(k, t)
            rig.localToWorld(probe.set(length(k) * Math.sin(a), PIVOT_Y - length(k) * Math.cos(a), depth(k)))
            return px(probe.x, probe.y, probe.z)
          }

          return {
            textStyle: 'stroke',
            textY: 232,
            brand: { color: '#cfc8ff', alpha: 0.6 },
            texts: [
              { at: 0, until: 3, lines: L.room.map(style) },
              { at: 3, until: 6, lines: L.send.map(style) },
              /* The video starts here, so the hook is in place with no entrance. */
              { at: 6, until: 99, still: true, lines: L.hook.map(style) },
            ],
            shakes: [[0, 30]],

            background(t) {
              const sky = ctx.createLinearGradient(0, 0, 0, H)
              sky.addColorStop(0, '#0d0b2a')
              sky.addColorStop(0.55, INDIGO)
              sky.addColorStop(1, '#050414')
              ctx.fillStyle = sky
              ctx.fillRect(0, 0, W, H)
              for (let i = 0; i < 90; i++) {
                const twinkle = 0.5 + 0.5 * Math.sin((t / D) * TAU * (1 + (i % 3)) + i)
                ctx.fillStyle = `rgba(255,255,255,${0.12 + 0.4 * twinkle * rand(i, 3)})`
                ctx.beginPath()
                ctx.arc(rand(i, 1) * W, rand(i, 2) * H, 1.5 + 2.5 * rand(i, 4), 0, TAU)
                ctx.fill()
              }
              /* Light trails: where each plate has just been. */
              rig.updateMatrixWorld()
              ctx.save()
              ctx.globalCompositeOperation = 'lighter'
              for (let k = COUNT - 1; k >= 0; k--)
                for (let j = 9; j >= 1; j--) {
                  const [x, y] = spot(k, t - j * 0.022)
                  ctx.globalAlpha = 0.16 * (1 - j / 10)
                  ctx.fillStyle = GLOW[k]
                  ctx.beginPath()
                  ctx.arc(x, y, lerp(70, 52, k / COUNT), 0, TAU)
                  ctx.fill()
                }
              ctx.restore()
            },

            pose(t) {
              arms.forEach((arm, k) => (arm.rotation.z = swing(k, t)))
            },

            over(t) {
              /* Three, two, one, into the moment they line up. */
              if (t >= 7) {
                const n = 10 - Math.floor(t)
                const a = t - Math.floor(t)
                api.big(`${n}`, 540, 640, {
                  size: 260,
                  fill: '#ffffff',
                  stroke: INDIGO,
                  scale: lerp(1.5, 1, outCubic(seg(a, 0, 0.16))),
                  alpha: 1 - seg(a, 0.6, 0.95),
                })
              }
              api.impact(t, 540, 1150, 0.25)
              api.grain(t, 0.1)
            },
          }
        },
      })
    </script>
  </body>
</html>
