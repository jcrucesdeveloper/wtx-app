<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — only people who lift can read this (Three.js loop)</title>
    <!-- The "only X can read this" challenge, drawn as a blueprint: the real
         routine file types itself out, and each line it reads adds a pair of
         plates to a wireframe bar.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, lerp, pulse, outCubic, inCubic, TAU, W, H, MONO } = R

      const D = 10
      const BLUE = '#1246a8'
      const DEEP = '#0a2a6b'
      const CHALK = '#f4f8ff'
      /* Lines of the real file, examples/templates/push-day.wtt */
      const LINES = [
        '# Push Day',
        'Bench Press | reps 4x8 | 60 | rest 1m30s',
        'Triceps Pushdown | reps 3x12 | 20 | rest 1m',
        'Side Lateral Raise | reps 3x15 | 8 | rest 1m',
      ]
      /* The first line is already half typed on frame 1. */
      const TYPE_AT = [-0.2, 0.9, 2.7, 4.5]
      const TYPE_RATE = 40
      const PLATES = [
        { at: 2.05, r: 0.62, note: '60 kg' },
        { at: 3.85, r: 0.5, note: '20 kg' },
        { at: 5.65, r: 0.38, note: '8 kg' },
      ]
      const T_READ = 6.2
      const T_SEND = 8.2
      const T_RESET = 9.5
      const BAR_Y = -1.05

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'blueprint',
        duration: D,
        copy: {
          en: {
            hook: ['only people who lift', 'can read this:'],
            read: ['you just read', 'my whole routine file'],
            send: ['send it to someone', 'who lifts'],
          },
          es: {
            hook: ['solo quien entrena', 'puede leer esto:'],
            read: ['acabas de leer', 'mi rutina entera'],
            send: ['mándaselo a alguien', 'que entrene'],
          },
        },
        build(api) {
          const { L, ctx, px, scene } = api
          const style = (t) => ({ t, bg: DEEP })
          const ink = new THREE.LineBasicMaterial({ color: CHALK })
          const wash = new THREE.MeshBasicMaterial({ color: 0x3f74dc, transparent: true, opacity: 0.35 })
          /** A cylinder along the bar, drawn as its edges over a faint wash. */
          function wire(radius, length, sides) {
            const geo = new THREE.CylinderGeometry(radius, radius, length, sides)
            const group = new THREE.Group()
            group.add(new THREE.Mesh(geo, wash), new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), ink))
            group.rotation.z = Math.PI / 2
            return group
          }

          const barbell = new THREE.Group()
          barbell.position.y = BAR_Y
          scene.add(barbell)
          const bar = wire(0.05, 3.7, 8)
          barbell.add(bar)
          const pairs = PLATES.map(({ r }, k) =>
            [-1, 1].map((side) => {
              const plate = new THREE.Group()
              plate.add(wire(r, 0.15, 28))
              barbell.add(plate)
              return { plate, side, slot: 0.9 + k * 0.2 }
            }),
          )

          const turn = (t) => (t / D) * TAU

          return {
            textStyle: 'stroke',
            textY: 235,
            brand: { color: CHALK, alpha: 0.6 },
            texts: [
              { at: -1, until: T_READ, lines: L.hook.map(style) },
              { at: T_READ, until: T_SEND, lines: L.read.map(style) },
              { at: T_SEND, until: T_RESET, lines: L.send.map(style) },
              { at: T_RESET + 0.15, until: 99, lines: L.hook.map(style) },
            ],
            shakes: PLATES.map(({ at }) => [at, 10]),

            background(t) {
              ctx.fillStyle = BLUE
              ctx.fillRect(0, 0, W, H)
              /* Drafting paper: fine and heavy rules, sliding one heavy square per loop. */
              const drift = (t / D) * 180
              for (const [step, alpha, width] of [
                [45, 0.1, 2],
                [180, 0.22, 3],
              ]) {
                ctx.strokeStyle = `rgba(244,248,255,${alpha})`
                ctx.lineWidth = width
                ctx.beginPath()
                for (let x = -180; x <= W + 180; x += step) {
                  ctx.moveTo(x + drift, 0)
                  ctx.lineTo(x + drift, H)
                }
                for (let y = -180; y <= H + 180; y += step) {
                  ctx.moveTo(0, y + drift)
                  ctx.lineTo(W, y + drift)
                }
                ctx.stroke()
              }
            },

            pose(t) {
              barbell.rotation.set(0.28, turn(t), 0)
              barbell.scale.setScalar(Math.max(0.001, outCubic(seg(t, 0.2, 0.9)) * (1 - inCubic(seg(t, T_RESET, T_RESET + 0.3)))))
              pairs.forEach((pair, k) => {
                const on = outCubic(seg(t, PLATES[k].at - 0.3, PLATES[k].at))
                for (const { plate, side, slot } of pair) {
                  plate.visible = on > 0
                  plate.position.x = side * (lerp(4.6, slot, on) + pulse(t, PLATES[k].at, 0.06, 30, 12))
                }
              })
            },

            over(t) {
              const gone = seg(t, T_RESET, T_RESET + 0.2)
              ctx.save()
              ctx.globalAlpha = 1 - gone
              ctx.textBaseline = 'middle'
              ctx.textAlign = 'left'
              LINES.forEach((text, i) => {
                /* The first line starts again before the loop ends. */
                const again = i === 0 && t >= T_RESET + 0.3
                const typed = Math.floor(((again ? t - D : t) - TYPE_AT[i]) * TYPE_RATE)
                if (typed <= 0) return
                ctx.globalAlpha = again ? 1 : 1 - gone
                const y = 560 + i * 84
                ctx.font = `600 26px ${MONO}`
                ctx.fillStyle = 'rgba(244,248,255,0.5)'
                ctx.fillText(`0${i + 1}`, 30, y)
                ctx.font = `700 36px ${MONO}`
                ctx.fillStyle = i === 0 ? '#ffe94d' : CHALK
                const shown = text.slice(0, typed)
                ctx.fillText(shown, 84, y)
                /* The cursor sits after the line being typed, and blinks once it is done. */
                const last = again || i === LINES.length - 1 || t < TYPE_AT[i + 1]
                if (last && (typed < text.length || Math.floor(t * 3) % 2 === 0))
                  ctx.fillRect(84 + ctx.measureText(shown).width + 6, y - 22, 20, 44)
              })

              /* A dimension note on each plate once it is on the bar. */
              PLATES.forEach(({ at, r, note }, k) => {
                const shown = seg(t, at, at + 0.2)
                if (shown <= 0) return
                const slot = 0.9 + k * 0.2
                const a = turn(t)
                const [x, y] = px(slot * Math.cos(a), BAR_Y + r, -slot * Math.sin(a))
                /* The notes keep their place while the bar turns under them. */
                const ny = 900 + k * 46
                ctx.globalAlpha = shown * (1 - gone)
                ctx.strokeStyle = CHALK
                ctx.lineWidth = 3
                ctx.beginPath()
                ctx.moveTo(x, y)
                ctx.lineTo(x, ny)
                ctx.lineTo(840, ny)
                ctx.stroke()
                ctx.fillStyle = CHALK
                ctx.textAlign = 'left'
                ctx.font = `700 32px ${MONO}`
                ctx.fillText(note, 852, ny)
              })

              /* The title block every drawing has. */
              ctx.globalAlpha = 0.8 * (1 - gone + seg(t, T_RESET + 0.3, T_RESET + 0.45))
              ctx.strokeStyle = CHALK
              ctx.lineWidth = 3
              ctx.strokeRect(250, 1392, 580, 64)
              ctx.fillStyle = CHALK
              ctx.textAlign = 'center'
              ctx.font = `600 28px ${MONO}`
              ctx.fillText('DWG: push-day.wtt · 300 B', 540, 1425)
              ctx.restore()
              api.grain(t, 0.1)
            },
          }
        },
      })
    </script>
  </body>
</html>
