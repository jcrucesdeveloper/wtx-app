<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — 1 or 2? (Three.js loop)</title>
    <!-- The this-or-that format: two ways to send a routine, and the viewer
         picks. Printed look: two inks on paper, halftone dots, grain.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { rand, TAU, W, H, MONO, SANS, DISPLAY } = R

      const D = 9
      const PAPER = '#f1e8d3'
      const INK = '#1b1b3a'
      const PINK = '#ff5fa2'
      const BLUE = '#1f6fd6'
      const SUN = '#ffe94d'
      /* The two panels, in frame pixels: [top, bottom]. */
      const A = [400, 905]
      const B = [985, 1440]
      const FILE_LINES = [
        '# Push Day',
        'unit: kg',
        '',
        'Bench Press | reps 4x8 | 60 | rest 1m30s',
        'Shoulder Press (Barbell) | reps 3x10 | 30',
        'Incline Dumbbell Press | reps 3x10 | 22',
        'Triceps Pushdown | reps 3x12 | 20 | rest 1m',
        'Side Lateral Raise | reps 3x15 | 8 | rest 1m',
      ]

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'this-or-that',
        duration: D,
        copy: {
          en: {
            hook: ['how do you send', 'your gym routine?'],
            ask: ['be honest.', '1 or 2?'],
            a: '7 screenshots',
            b: '1 file',
            or: 'OR',
          },
          es: {
            hook: ['¿cómo mandas', 'tu rutina de gym?'],
            ask: ['sé honesto.', '¿1 o 2?'],
            a: '7 capturas',
            b: '1 archivo',
            or: 'O',
          },
        },
        build(api) {
          const { L, ctx, scene } = api
          const line = (t) => ({ t, bg: INK, fg: PAPER })

          const shots = Array.from({ length: 7 }, (_, i) => {
            const mesh = api.face(0.62, 1.0, (c, w, h) => {
              c.fillStyle = '#ffffff'
              c.fillRect(0, 0, w, h)
              c.filter = 'blur(2px)'
              c.fillStyle = '#f3efe2'
              c.fillRect(14, 14, w - 28, h - 28)
              c.fillStyle = '#3a3a44'
              for (let r = 0; r < 22; r++) c.fillRect(34, 40 + r * 16, (w - 80) * (0.3 + 0.6 * rand(i + 3, r)), 6)
            })
            mesh.material.side = THREE.DoubleSide
            scene.add(mesh)
            return mesh
          })

          const file = api.card(1.0, 1.28, 0xffffff, (c, w, h) => {
            c.beginPath()
            c.roundRect(0, 0, w, h, 40)
            c.clip()
            c.fillStyle = '#ffffff'
            c.fillRect(0, 0, w, h)
            c.fillStyle = '#f0283c'
            c.fillRect(0, 0, w, 124)
            c.fillStyle = '#ffffff'
            c.textBaseline = 'middle'
            c.font = `800 46px ${MONO}`
            c.fillText('push-day.wtt', 30, 66)
            c.font = `600 22px ${MONO}`
            FILE_LINES.forEach((text, i) => {
              c.fillStyle = i === 0 ? '#f0283c' : '#0b0b10'
              c.fillText(text, 26, 176 + i * 42)
            })
          })

          /** A printed panel: flat ink, a second ink slightly out of register, halftone dots. */
          function panel([top, bottom], ink, dot, t, flip) {
            const h = bottom - top
            ctx.fillStyle = INK
            ctx.beginPath()
            ctx.roundRect(72, top + 12, 960, h, 44)
            ctx.fill()
            ctx.fillStyle = ink
            ctx.beginPath()
            ctx.roundRect(60, top, 960, h, 44)
            ctx.fill()
            ctx.save()
            ctx.clip()
            ctx.fillStyle = dot
            const drift = (t / D) * 44
            for (let y = top - 44; y < bottom + 44; y += 44)
              for (let x = 16; x < 1064; x += 44) {
                const across = (x - 60) / 960
                const size = 17 * (flip ? across : 1 - across)
                if (size < 1.5) continue
                ctx.beginPath()
                ctx.arc(x + ((y / 44) % 2 ? 22 : 0), y + drift, size, 0, TAU)
                ctx.fill()
              }
            ctx.restore()
          }

          return {
            textStyle: 'caption',
            textY: 205,
            brand: { color: INK, alpha: 0.6 },
            texts: [
              { at: -1, until: 4.5, lines: L.hook.map(line) },
              { at: 4.5, until: D, lines: L.ask.map(line) },
              { at: D, until: 99, lines: L.hook.map(line) },
            ],

            background(t) {
              ctx.fillStyle = PAPER
              ctx.fillRect(0, 0, W, H)
              panel(A, PINK, '#ff8fc0', t, false)
              panel(B, BLUE, '#4f95ee', t, true)
            },

            pose(t) {
              const a = (t / D) * TAU
              /* A mess that never settles: each screenshot on its own path. */
              shots.forEach((shot, i) => {
                const p = i * 0.9
                shot.position.set(
                  0.35 + 1.05 * Math.sin(a * (1 + (i % 3)) + p),
                  1.18 + 0.5 * Math.sin(a * (2 + (i % 2)) + p * 1.7),
                  0.5 * Math.sin(a * 2 + p),
                )
                shot.rotation.set(0.5 * Math.sin(a * 2 + p), 0.9 * Math.sin(a * (1 + (i % 2)) + p), a * (i % 2 ? 1 : -1) + p)
                shot.scale.setScalar(0.72)
              })
              /* One thing, turning once. */
              file.position.set(0.35, -1.0 + 0.06 * Math.sin(a * 2), 0.3)
              file.rotation.set(0.08 * Math.sin(a * 2), 0.55 * Math.sin(a), 0.04 * Math.sin(a * 3))
              file.scale.setScalar(1.05)
            },

            over(t) {
              const bounce = 1 + 0.04 * Math.sin((t / D) * TAU * 6)
              api.big('1', 170, A[0] + 110, { size: 190, fill: SUN, stroke: INK, scale: bounce, rot: -0.08 })
              api.big('2', 170, B[0] + 110, { size: 190, fill: SUN, stroke: INK, scale: bounce, rot: 0.08 })
              api.label(L.a, 250, A[1] - 62, { size: 46, weight: 800, bg: INK, fg: PAPER, font: SANS })
              api.label(L.b, 200, B[1] - 62, { size: 46, weight: 800, bg: INK, fg: PAPER, font: SANS })

              ctx.save()
              ctx.translate(540, (A[1] + B[0]) / 2 + 6)
              ctx.rotate(0.12 * Math.sin((t / D) * TAU * 2))
              ctx.fillStyle = INK
              ctx.beginPath()
              ctx.arc(0, 0, 74, 0, TAU)
              ctx.fill()
              ctx.fillStyle = PAPER
              ctx.textAlign = 'center'
              ctx.textBaseline = 'middle'
              ctx.font = `900 60px ${DISPLAY}`
              ctx.fillText(L.or, 0, 4)
              ctx.restore()
              api.grain(t, 0.22)
            },
          }
        },
      })
    </script>
  </body>
</html>
