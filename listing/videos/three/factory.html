<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — the screenshot machine (Three.js loop)</title>
    <!-- The satisfying-factory format: piles of routine screenshots ride a belt
         into a machine and one tidy file comes out, every two seconds, for ever.
         Toy colours on warm paper.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { rand, TAU, W, H, MONO, SANS } = R

      const D = 8
      /* The belt moves 3 units every 2 s, and a pile goes in every 3 units, so
         the whole line repeats every 2 s and the 8 s loop has no seam. */
      const SPEED = 1.5
      const SPACING = 3
      const MOUTH = 0.75
      const THUNK = 3.45
      const OUT = 3.9
      const PAPER = '#fbf3e4'
      const CORAL = '#ff6b5e'
      const TEAL = '#1d7874'
      const MUSTARD = '#f4b942'
      const NAVY = '#2b2d42'
      const mod = (x, m) => ((x % m) + m) % m

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'factory',
        duration: D,
        copy: {
          en: {
            hook: ['my routine screenshots go in', 'something sendable comes out'],
            count: ['7 screenshots in.', '1 file out.'],
            end: ["it's a 300-byte text file.", 'my gym partner just opens it.'],
          },
          es: {
            hook: ['entran mis capturas de rutina', 'sale algo que sí puedo mandar'],
            count: ['entran 7 capturas.', 'sale 1 archivo.'],
            end: ['es un archivo de texto de 300 bytes.', 'mi gym bro solo lo abre.'],
          },
        },
        build(api) {
          const { L, ctx, scene } = api
          const style = (t) => ({ t, bg: NAVY, fg: PAPER })
          const clay = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0 })
          const box = (w, h, d, color) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), clay(color))

          /* The whole line sits in one group, turned to a three-quarter view. */
          const line = new THREE.Group()
          line.rotation.set(0.5, -0.3, 0)
          line.scale.setScalar(0.7)
          line.position.set(0.1, -0.75, 0)
          scene.add(line)

          const belt = box(9, 0.16, 1.15, TEAL)
          belt.position.y = -0.08
          line.add(belt)
          const slats = Array.from({ length: 18 }, () => {
            const slat = box(0.09, 0.03, 1.05, '#2fa39d')
            line.add(slat)
            return slat
          })

          const machine = new THREE.Group()
          const body = box(1.6, 1.7, 1.55, CORAL)
          body.position.y = 0.85
          const cap = box(1.75, 0.16, 1.7, '#e2554a')
          cap.position.y = 1.74
          const funnel = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.24, 0.4, 24), clay(MUSTARD))
          funnel.position.set(-0.3, 2.0, 0)
          const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 14), new THREE.MeshBasicMaterial({ color: MUSTARD }))
          lamp.position.set(0.45, 1.98, 0.3)
          const plaque = api.face(1.2, 0.7, (c, w, h) => {
            c.fillStyle = PAPER
            c.beginPath()
            c.roundRect(0, 0, w, h, 40)
            c.fill()
            c.fillStyle = NAVY
            c.textAlign = 'center'
            c.textBaseline = 'middle'
            c.font = `800 150px ${MONO}`
            c.fillText('.wtt', w / 2, h / 2 + 8)
          })
          plaque.position.set(0, 1.0, 0.78)
          machine.add(body, cap, funnel, lamp, plaque)
          for (const side of [-1, 1]) {
            const mouth = box(0.04, 1.0, 1.0, NAVY)
            mouth.position.set(side * 0.8, 0.55, 0)
            machine.add(mouth)
          }
          line.add(machine)

          /* A pile is seven screenshots standing every which way. */
          const piles = [0, 1].map((k) => {
            const pile = new THREE.Group()
            for (let i = 0; i < 7; i++) {
              const shot = api.face(0.5, 0.8, (c, w, h) => {
                c.fillStyle = '#ffffff'
                c.fillRect(0, 0, w, h)
                c.fillStyle = '#f3efe2'
                c.fillRect(10, 10, w - 20, h - 20)
                c.fillStyle = '#3a3a44'
                for (let r = 0; r < 16; r++) c.fillRect(26, 34 + r * 17, (w - 60) * (0.3 + 0.6 * rand(i + 9 * k, r)), 6)
              })
              shot.material.side = THREE.DoubleSide
              shot.position.set((rand(i, k) - 0.5) * 0.7, 0.42 + rand(i, k + 5) * 0.12, (rand(i, k + 9) - 0.5) * 0.6)
              shot.rotation.set(0, 0.5 + (rand(i, k + 2) - 0.5) * 1.6, (rand(i, k + 3) - 0.5) * 0.7)
              pile.add(shot)
            }
            line.add(pile)
            return pile
          })

          const files = [0, 1].map(() => {
            const file = api.card(0.72, 0.92, 0xffffff, (c, w, h) => {
              c.beginPath()
              c.roundRect(0, 0, w, h, 30)
              c.clip()
              c.fillStyle = '#ffffff'
              c.fillRect(0, 0, w, h)
              c.fillStyle = '#f0283c'
              c.fillRect(0, 0, w, 86)
              c.fillStyle = '#ffffff'
              c.textBaseline = 'middle'
              c.font = `800 34px ${MONO}`
              c.fillText('push-day.wtt', 18, 46)
              c.fillStyle = NAVY
              for (let r = 0; r < 6; r++) c.fillRect(22, 130 + r * 36, (w - 60) * (0.5 + 0.45 * rand(r, 4)), 12)
            })
            line.add(file)
            return file
          })

          const probe = new THREE.Vector3()
          const onFrame = (x, y, z) => {
            line.localToWorld(probe.set(x, y, z))
            return api.px(probe.x, probe.y, probe.z)
          }
          /** Seconds since the machine last stamped. */
          const sinceThunk = (t) => mod(t * SPEED - THUNK, SPACING) / SPEED

          return {
            textStyle: 'caption',
            textY: 240,
            brand: { color: NAVY, alpha: 0.6 },
            texts: [
              { at: -1, until: 3, lines: L.hook.map(style) },
              { at: 3, until: 5.5, lines: L.count.map(style) },
              { at: 5.5, until: D, lines: L.end.map(style) },
              { at: D, until: 99, still: true, lines: L.hook.map(style) },
            ],

            background(t) {
              ctx.fillStyle = PAPER
              ctx.fillRect(0, 0, W, H)
              /* Awning stripes, sliding one stripe per loop. */
              ctx.save()
              ctx.translate(540, 960)
              ctx.rotate(-0.5)
              ctx.fillStyle = 'rgba(244,185,66,0.2)'
              const drift = (t / D) * 220
              for (let x = -1800; x < 1800; x += 220) ctx.fillRect(x + drift, -1600, 110, 3200)
              ctx.restore()
              const [sx, sy] = api.px(0.1, -2.2, 0)
              ctx.fillStyle = 'rgba(43,45,66,0.14)'
              ctx.beginPath()
              ctx.ellipse(sx, sy, 470, 70, -0.12, 0, TAU)
              ctx.fill()
            },

            pose(t) {
              slats.forEach((slat, i) => slat.position.set(mod(i * 0.5 + t * SPEED, 9) - 4.5, 0.01, 0))

              piles.forEach((pile, k) => {
                const u = mod(t * SPEED + k * SPACING, SPACING * 2)
                pile.position.x = -(MOUTH + 3) + u
                pile.visible = pile.position.x < -MOUTH + 0.25
              })
              files.forEach((file, k) => {
                const u = mod(t * SPEED + k * SPACING - OUT, SPACING * 2)
                file.visible = u < 3.3
                file.position.set(MOUTH + u, 0.52, 0)
                /* Turned back to face the camera. */
                file.rotation.set(-0.2, 0.3, 0)
                file.scale.setScalar(Math.min(1, 0.2 + u / 0.35))
              })

              const m = sinceThunk(t)
              const squash = 0.12 * Math.exp(-8 * m) * Math.sin(26 * m)
              machine.scale.set(1 + squash, 1 - squash, 1 + squash)
              lamp.scale.setScalar(1 + 1.2 * Math.exp(-5 * m))
              line.updateMatrixWorld()
            },

            over(t) {
              const m = sinceThunk(t)
              /* Puffs from the funnel on every stamp. */
              const [fx, fy] = onFrame(-0.3, 2.3, 0)
              for (let i = 0; i < 3; i++) {
                const k = (m - i * 0.07) / 0.6
                if (k <= 0 || k >= 1) continue
                ctx.fillStyle = `rgba(43,45,66,${0.22 * (1 - k)})`
                ctx.beginPath()
                ctx.arc(fx + (i - 1) * 30 * k, fy - 130 * k, 18 + 34 * k, 0, TAU)
                ctx.fill()
              }
              const [x, y] = onFrame(0, 2.75, 0)
              api.label('7 → 1', x + 40, y - 10, {
                size: 64,
                weight: 900,
                bg: NAVY,
                fg: MUSTARD,
                font: SANS,
                scale: 1 + 0.25 * Math.exp(-7 * m) * Math.sin(24 * m),
              })
              api.grain(t, 0.13)
            },
          }
        },
      })
    </script>
  </body>
</html>
