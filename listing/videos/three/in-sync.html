<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — in sync (Three.js loop)</title>
    <!-- The "oddly satisfying" loop: two barbells load, lift, turn and unload on
         exactly the same beat. Soft pastels, almost no text.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, lerp, pulse, inOut, inCubic, outCubic, TAU, W, H, SANS } = R

      const D = 8
      const PAIRS = 4
      const SLIDE = 0.3
      const ON = [0, 0.5, 1.0, 1.5]
      /* Off in the opposite order: the outside pair leaves first. */
      const OFF = [6.5, 6.0, 5.5, 5.0]
      const T_REP = 2.1
      const T_TURN = 3.3
      const AWAY = 4.6
      const BARS = [
        { y: 0.75, colors: ['#ff8f70', '#ffb38a', '#ffd0a8', '#fff0d6'] },
        { y: -1.05, colors: ['#3fbfa0', '#7fd8be', '#b5ecd9', '#e6fbf3'] },
      ]
      const PLUM = '#3a2a55'

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'in-sync',
        duration: D,
        copy: {
          en: { hook: ['me and my gym partner', 'every set, in sync'], sub: 'different gyms. same room.' },
          es: { hook: ['mi gym bro y yo', 'cada serie, en sincronía'], sub: 'gimnasios distintos. la misma sala.' },
        },
        build(api) {
          const { L, ctx, px, scene } = api
          const clay = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0 })
          const alongX = (mesh) => {
            mesh.rotation.z = Math.PI / 2
            return mesh
          }

          const bars = BARS.map(({ y, colors }) => {
            const group = new THREE.Group()
            group.add(alongX(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.7, 24), clay('#5b4a7a'))))
            const pairs = colors.map((color, k) => {
              const r = 0.55 - k * 0.07
              return [-1, 1].map((side) => {
                const plate = new THREE.Group()
                plate.add(alongX(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.14, 56), clay(color))))
                plate.add(alongX(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.16, 32), clay('#5b4a7a'))))
                group.add(plate)
                return { plate, side, slot: 0.95 + k * 0.165 }
              })
            })
            scene.add(group)
            return { group, pairs, y }
          })

          /** How far along its slide a pair is: 0 away, 1 on the bar. */
          function seated(k, t) {
            /* The first pair starts its slide before the loop ends. */
            const tt = k === 0 && t > D - 1 ? t - D : t
            return outCubic(seg(tt, ON[k] - SLIDE, ON[k])) * (1 - inCubic(seg(tt, OFF[k], OFF[k] + SLIDE)))
          }
          const beat = (t) => {
            let ring = 0
            for (const at of ON) ring += pulse(t, at, 1, 26, 9)
            return ring
          }

          return {
            textStyle: 'caption',
            textY: 250,
            brand: { color: PLUM, alpha: 0.45 },
            texts: [{ at: -1, until: 99, lines: L.hook }],

            background(t) {
              const sky = ctx.createLinearGradient(0, 0, 0, H)
              sky.addColorStop(0, '#cdb8ff')
              sky.addColorStop(0.55, '#ffd9e6')
              sky.addColorStop(1, '#ffd0b0')
              ctx.fillStyle = sky
              ctx.fillRect(0, 0, W, H)
              /* Soft lights that go round once per loop. */
              const blobs = [
                [300, 500, 520, '#fff6c9', 0],
                [820, 1200, 600, '#b8f1e0', 2.1],
                [420, 1500, 480, '#ffc2dc', 4.2],
              ]
              for (const [x, y, r, color, phase] of blobs) {
                const a = (t / D) * TAU + phase
                const cx = x + 120 * Math.cos(a)
                const cy = y + 120 * Math.sin(a)
                const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r)
                g.addColorStop(0, color)
                g.addColorStop(1, `${color}00`)
                ctx.globalAlpha = 0.7
                ctx.fillStyle = g
                ctx.fillRect(0, 0, W, H)
                ctx.globalAlpha = 1
              }
              /* A soft shadow under each bar. */
              for (const bar of bars) {
                const [x, y] = px(0, bar.y - 0.85, 0)
                const lift = (bar.group.position.y - bar.y) * 256
                ctx.fillStyle = 'rgba(58,42,85,0.16)'
                ctx.beginPath()
                ctx.ellipse(x, y, 430 - lift * 0.5, 38 - lift * 0.05, 0, 0, TAU)
                ctx.fill()
              }
            },

            pose(t) {
              const rep = 0.38 * Math.sin(Math.PI * seg(t, T_REP, T_TURN)) ** 2
              const turn = TAU * inOut(seg(t, T_TURN, T_TURN + 1.3))
              const knock = 0.05 * beat(t)
              for (const bar of bars) {
                bar.group.position.set(0, bar.y + rep - knock, 0)
                bar.group.rotation.set(0, turn + 0.18 * Math.sin((t / D) * TAU), 0)
                bar.pairs.forEach((pair, k) => {
                  const s = seated(k, t)
                  for (const { plate, side, slot } of pair) {
                    plate.visible = s > 0.001
                    plate.position.x = side * (lerp(AWAY, slot, s) + pulse(t, ON[k], 0.05, 30, 12))
                  }
                })
              }
            },

            over(t) {
              /* The link between the two: it lights on every beat. */
              const [x, y0] = px(0, BARS[0].y - 0.7, 0)
              const y1 = px(0, BARS[1].y + 0.7, 0)[1]
              const lit = Math.abs(beat(t))
              ctx.fillStyle = PLUM
              for (let i = 0; i <= 6; i++) {
                ctx.globalAlpha = 0.25 + 0.6 * Math.min(1, lit)
                ctx.beginPath()
                ctx.arc(x, lerp(y0, y1, i / 6), 7 + 5 * Math.min(1, lit), 0, TAU)
                ctx.fill()
              }
              ctx.globalAlpha = 1
              const shown = seg(t, 4.0, 4.3) * (1 - seg(t, 7.0, 7.3))
              api.label(L.sub, 540, 1410, { size: 42, weight: 700, bg: PLUM, fg: '#fff6ec', font: SANS, alpha: shown })
              api.grain(t, 0.12)
            },
          }
        },
      })
    </script>
  </body>
</html>
