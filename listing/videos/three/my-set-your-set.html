<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — my set, your set (Three.js loop)</title>
    <!-- Newton's cradle, with plates: one end swings out and back, the other
         answers. Sharing a bench with a gym partner. A desk toy in a sage studio.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { pulse, TAU, W, H, DISPLAY, SANS } = R

      const D = 8
      const PLATES = 5
      const RADIUS = 0.36
      const GAP = RADIUS * 2
      const CORD = 2.0
      const REACH = 0.5
      const TOP = 1.75
      const SCALE = 0.74
      const FOREST = '#24402f'
      const CLAY = '#e2725b'
      const SLATE = '#3d5a80'
      const CREAM = '#f5ecd9'
      /* A swing out and back takes one second, so each end goes once every two. */
      const beat = (t) => Math.floor(t + 1e-6)
      const swingOf = (i, t) => {
        const half = beat(t) % 2
        const a = REACH * Math.sin(Math.PI * (t - beat(t)))
        if (i === 0 && half === 0) return -a
        if (i === PLATES - 1 && half === 1) return a
        return 0
      }

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'my-set-your-set',
        duration: D,
        copy: {
          en: {
            hook: ['sharing a bench', 'with my gym partner'],
            turns: ['my set. your set.', 'my set. your set.'],
            live: ['we both see every set', 'the second it lands'],
            names: ['YOU', 'ALEX'],
          },
          es: {
            hook: ['compartiendo banco', 'con mi gym bro'],
            turns: ['mi serie. tu serie.', 'mi serie. tu serie.'],
            live: ['los dos vemos cada serie', 'en cuanto se anota'],
            names: ['TÚ', 'ALEX'],
          },
        },
        build(api) {
          const { L, ctx, px, scene } = api
          const style = (t) => ({ t, fg: FOREST })
          const chrome = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, roughness: 0.12, metalness: 1 })
          const toy = new THREE.Group()
          toy.scale.setScalar(SCALE)
          toy.position.y = 0.15
          scene.add(toy)

          /* The frame: two rails on four legs. */
          for (const z of [-0.5, 0.5]) {
            const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, GAP * PLATES + 0.9, 16), chrome)
            rail.rotation.z = Math.PI / 2
            rail.position.set(0, TOP, z)
            toy.add(rail)
            for (const side of [-1, 1]) {
              const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, TOP + 2.45, 16), chrome)
              leg.position.set(side * (GAP * PLATES + 0.9) * 0.5, (TOP - 2.45) / 2, z)
              toy.add(leg)
            }
          }

          const arms = Array.from({ length: PLATES }, (_, i) => {
            const end = i === 0 ? 0 : i === PLATES - 1 ? 1 : -1
            const color = end === 0 ? CLAY : end === 1 ? SLATE : CREAM
            const arm = new THREE.Group()
            arm.position.set((i - (PLATES - 1) / 2) * GAP, TOP, 0)
            for (const z of [-0.5, 0.5]) {
              const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, Math.hypot(CORD, 0.5), 6), chrome)
              cord.position.set(0, -CORD / 2, z / 2)
              cord.rotation.x = Math.atan2(z, CORD) * -1
              arm.add(cord)
            }
            const body = new THREE.Mesh(
              new THREE.CylinderGeometry(RADIUS, RADIUS, 0.2, 64),
              new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.15 }),
            )
            body.rotation.x = Math.PI / 2
            body.position.y = -CORD
            arm.add(body)
            if (end >= 0) {
              const face = api.face(RADIUS * 2, RADIUS * 2, (c, w) => {
                c.fillStyle = CREAM
                c.textAlign = 'center'
                c.textBaseline = 'middle'
                c.font = `900 ${w * 0.3}px ${DISPLAY}`
                c.fillText(L.names[end], w / 2, w / 2 + 6)
              })
              face.position.set(0, -CORD, 0.102)
              arm.add(face)
            }
            toy.add(arm)
            return arm
          })

          const done = (who, t) => Math.floor((beat(t) + (who ? 0 : 1)) / 2)
          const spot = new THREE.Vector3()
          const where = (i, t) => {
            const a = swingOf(i, t)
            toy.localToWorld(spot.set((i - (PLATES - 1) / 2) * GAP + CORD * Math.sin(a), TOP - CORD * Math.cos(a), 0))
            return px(spot.x, spot.y, spot.z)
          }

          return {
            textStyle: 'caption',
            textY: 250,
            brand: { color: FOREST, alpha: 0.55 },
            texts: [
              { at: -1, until: 2.5, lines: L.hook.map(style) },
              { at: 2.5, until: 5, lines: L.turns.map(style) },
              { at: 5, until: D, lines: L.live.map(style) },
              { at: D, until: 99, still: true, lines: L.hook.map(style) },
            ],
            shakes: Array.from({ length: D }, (_, n) => [n, 9]),

            background(t) {
              /* A studio sweep: wall, floor, and the line where they meet. */
              const wall = ctx.createLinearGradient(0, 0, 0, 1240)
              wall.addColorStop(0, '#dbe8cf')
              wall.addColorStop(1, '#c6d8b7')
              ctx.fillStyle = wall
              ctx.fillRect(0, 0, W, H)
              const floor = ctx.createLinearGradient(0, 1240, 0, H)
              floor.addColorStop(0, '#b4c9a3')
              floor.addColorStop(1, '#a3bb92')
              ctx.fillStyle = floor
              ctx.fillRect(0, 1240, W, H - 1240)
              toy.updateMatrixWorld()
              for (let i = 0; i < PLATES; i++) {
                const [x, y] = where(i, t)
                const lift = Math.max(0, 1170 - y)
                ctx.fillStyle = `rgba(36,64,47,${0.2 - lift * 0.0004})`
                ctx.beginPath()
                ctx.ellipse(x, 1330, 78 + lift * 0.2, 16 + lift * 0.04, 0, 0, TAU)
                ctx.fill()
              }
            },

            pose(t) {
              toy.rotation.set(0.12, 0.22 * Math.sin((t / D) * TAU), 0)
              arms.forEach((arm, i) => (arm.rotation.z = swingOf(i, t)))
            },

            over(t) {
              /* A spark where the plates meet, on every beat. */
              const a = t - beat(t)
              if (a < 0.2) {
                const from = beat(t) % 2 === 0 ? PLATES - 1 : 0
                const [x, y] = where(from, t)
                const cx = x + (from ? -1 : 1) * RADIUS * 256 * SCALE
                ctx.strokeStyle = '#ffffff'
                ctx.lineCap = 'round'
                ctx.lineWidth = 10 * (1 - a / 0.2)
                for (let i = 0; i < 8; i++) {
                  const ang = (i / 8) * TAU + 0.4
                  const k = a / 0.2
                  ctx.beginPath()
                  ctx.moveTo(cx + Math.cos(ang) * (20 + 60 * k), y + Math.sin(ang) * (20 + 60 * k))
                  ctx.lineTo(cx + Math.cos(ang) * (44 + 110 * k), y + Math.sin(ang) * (44 + 110 * k))
                  ctx.stroke()
                }
              }
              ;[0, 1].forEach((who) => {
                const n = Math.min(4, done(who, t))
                api.label(`${L.names[who]}  ${n}/4`, who ? 800 : 280, 1420, {
                  size: 44,
                  weight: 900,
                  font: SANS,
                  bg: who ? SLATE : CLAY,
                  fg: CREAM,
                  scale: 1 + pulse(t, beat(t), beat(t) % 2 === (who ? 0 : 1) && beat(t) > 0 ? 0.2 : 0, 26, 10),
                })
              })
              api.grain(t, 0.1)
            },
          }
        },
      })
    </script>
  </body>
</html>
