<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — 1 routine, 6 gym bros (Three.js loop)</title>
    <!-- Sharing: one routine file copies itself out to six phones.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, lerp, pop, pulse, inOut, inCubic, dark, tint, YELLOW, BLUE, RED, LIME, GREEN, INK, WHITE, SANS, MONO, TAU } = R

      const D = 9
      const FLIGHT = 0.45
      const SEND_T = [0.55, 1.05, 1.55, 2.05, 2.55, 3.05]
      const T_SAME = 3.7
      const T_FILE = 5.5
      const T_CTA = 6.9
      const T_RESET = 8.4
      const HOME = [0, -0.1, 0.6]
      /* Two columns of three, either side of the file. */
      const SEATS = [
        [-1.42, 0.95], [1.42, 0.95], [-1.42, -0.1], [1.42, -0.1], [-1.42, -1.15], [1.42, -1.15],
      ]
      const FACES = [RED, BLUE, '#ff8a00', '#8b5cf6', '#06b6d4', '#84cc16']
      const DOTS = [YELLOW, '#c9ccd6', BLUE, '#8a8fa3', LIME]
      const FILE_LINES = [
        '# Push Day',
        'unit: kg',
        '',
        'Bench Press | reps 4x8 | 60 | rest 1m30s',
        'Shoulder Press (Barbell) | reps 3x10 | 30',
        'Incline Dumbbell Press | reps 3x10 | 22',
        'Triceps Pushdown | reps 3x12 | 20 | rest 1m',
        'Side Lateral Raise | reps 3x15 | 8 | rest 1m',
      ]

      function drawFile(c, w, h) {
        c.beginPath()
        c.roundRect(0, 0, w, h, 40)
        c.clip()
        c.fillStyle = WHITE
        c.fillRect(0, 0, w, h)
        c.fillStyle = RED
        c.fillRect(0, 0, w, 124)
        c.fillStyle = WHITE
        c.textBaseline = 'middle'
        c.font = `800 46px ${MONO}`
        c.fillText('push-day.wtt', 30, 66)
        c.font = `600 22px ${MONO}`
        FILE_LINES.forEach((line, i) => {
          c.fillStyle = i === 0 ? RED : INK
          c.fillText(line, 26, 176 + i * 42)
        })
      }

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'pass-it-on',
        duration: D,
        copy: {
          en: {
            hook: [dark('1 ROUTINE.'), tint('6 GYM BROS.', WHITE, RED)],
            same: [dark('SAME PLAN.'), tint('EVERYONE.', WHITE, BLUE)],
            file: [dark("IT'S JUST A FILE."), tint('SEND IT.', YELLOW)],
            cta: [dark('SEND YOURS TO'), tint('THE GROUP CHAT', YELLOW)],
          },
          es: {
            hook: [dark('1 RUTINA.'), tint('6 GYM BROS.', WHITE, RED)],
            same: [dark('EL MISMO PLAN.'), tint('TODOS.', WHITE, BLUE)],
            file: [dark('ES SOLO UN ARCHIVO.'), tint('MÁNDALO.', YELLOW)],
            cta: [dark('MANDA LA TUYA'), tint('AL GRUPO', YELLOW)],
          },
        },
        build(api) {
          const { L, ctx, px } = api
          const file = api.card(1.0, 1.28, 0xffffff, drawFile)
          const copies = SEATS.map(() => api.card(1.0, 1.28, 0xffffff, drawFile))
          const phones = SEATS.map(() => api.phone())

          const waiting = (i) => (c, w, h) => {
            c.fillStyle = WHITE
            c.fillRect(0, 0, w, h)
            c.fillStyle = '#eef0f5'
            c.fillRect(0, 0, w, 230)
            c.fillStyle = FACES[i]
            c.beginPath()
            c.arc(w / 2, 120, 70, 0, TAU)
            c.fill()
            c.fillStyle = '#d9dce6'
            for (let k = 0; k < 3; k++) {
              c.beginPath()
              c.arc(w / 2 - 80 + k * 80, 620, 26, 0, TAU)
              c.fill()
            }
          }
          const got = (c, w, h) => {
            c.fillStyle = GREEN
            c.fillRect(0, 0, w, h)
            c.strokeStyle = WHITE
            c.lineWidth = 70
            c.lineCap = c.lineJoin = 'round'
            c.beginPath()
            c.moveTo(120, 560)
            c.lineTo(220, 670)
            c.lineTo(400, 450)
            c.stroke()
          }
          const routine = (i) => (c, w, h) => {
            c.fillStyle = WHITE
            c.fillRect(0, 0, w, h)
            c.fillStyle = FACES[i]
            c.fillRect(0, 0, w, 190)
            for (let k = 0; k < 5; k++) {
              c.fillStyle = INK
              c.beginPath()
              c.roundRect(34, 250 + k * 160, w - 68, 124, 34)
              c.fill()
              c.fillStyle = DOTS[k]
              c.beginPath()
              c.arc(100, 312 + k * 160, 26, 0, TAU)
              c.fill()
              c.fillStyle = WHITE
              c.fillRect(150, 298 + k * 160, 150 + ((k * 53) % 130), 28)
            }
          }

          const landed = (t) => SEND_T.filter((at) => t >= at + FLIGHT && t < T_RESET).length

          return {
            texts: [
              { at: -1, until: T_SAME, lines: L.hook },
              { at: T_SAME, until: T_FILE, lines: L.same },
              { at: T_FILE, until: T_CTA, lines: L.file },
              { at: T_CTA, until: T_RESET, lines: L.cta },
              { at: T_RESET + 0.15, until: 99, lines: L.hook },
            ],
            wipes: [
              { at: T_SAME, color: BLUE, from: [540, 986] },
              { at: T_FILE, color: RED, from: [540, 986] },
              { at: T_RESET, color: YELLOW, from: [540, 960] },
            ],
            shakes: [[T_SAME, 24], [T_FILE, 18]],
            cta: [T_CTA, T_RESET],

            pose(t) {
              let kick = pulse(t, T_FILE, 0.18)
              for (const at of SEND_T) kick += pulse(t, at, 0.07)
              file.position.set(HOME[0], HOME[1] + 0.06 * Math.sin((t / D) * 4 * TAU), HOME[2])
              file.rotation.set(
                0.1 * Math.sin((t / D) * 2 * TAU),
                /* The opening turn starts before the loop ends, so frame 1 is already moving. */
                TAU * inOut(seg(t > T_RESET ? t - D : t, -0.3, 0.6)) + TAU * inOut(seg(t, T_FILE, T_FILE + 0.7)) + 0.35 * Math.sin((t / D) * 3 * TAU),
                0,
              )
              file.scale.setScalar(1.15 + kick)

              phones.forEach((p, i) => {
                const [x, y] = SEATS[i]
                const side = Math.sign(x)
                /* In one by one after the first frame, out together at the reset. */
                const here = pop(t, 0.04 + i * 0.05) * (1 - inCubic(seg(t, T_RESET, T_RESET + 0.25)))
                const got_ = t >= SEND_T[i] + FLIGHT
                const wave = Math.sin(Math.PI * seg(t, T_SAME + 0.1 + i * 0.09, T_SAME + 0.5 + i * 0.09))
                p.group.position.set(x, y + 0.3 * wave, 0)
                p.group.rotation.set(0, -side * 0.3, -side * 0.06 + 0.04 * Math.sin((t / D) * 4 * TAU + i))
                p.group.scale.setScalar(Math.max(0.001, 0.34 * here * (1 + pulse(t, SEND_T[i] + FLIGHT, 0.3))))
                if (!got_ || t >= T_RESET) p.paint('wait', waiting(i))
                else if (t < T_SAME) p.paint('got', got)
                else p.paint('routine', routine(i))
              })

              copies.forEach((copy, i) => {
                const k = (t - SEND_T[i]) / FLIGHT
                copy.visible = k > 0 && k < 1
                if (!copy.visible) return
                const [x, y] = SEATS[i]
                const u = 1 - k
                copy.position.set(
                  lerp(HOME[0], x, k),
                  u * HOME[1] + k * y + 0.5 * Math.sin(Math.PI * k),
                  u * HOME[2] + 1.3 * Math.sin(Math.PI * k),
                )
                copy.rotation.set(0, 0, -Math.sign(x) * TAU * k)
                copy.scale.setScalar(lerp(0.9, 0.26, k))
              })
            },

            over(t) {
              const n = landed(t)
              if (n > 0) {
                const [x, y] = px(HOME[0] + 0.55, HOME[1] + 0.72, HOME[2])
                let s = 1
                for (const at of SEND_T) s += pulse(t, at + FLIGHT, 0.35, 26, 10)
                ctx.save()
                ctx.translate(x, y)
                ctx.scale(s, s)
                ctx.fillStyle = INK
                ctx.beginPath()
                ctx.arc(0, 0, 78, 0, TAU)
                ctx.fill()
                ctx.fillStyle = YELLOW
                ctx.beginPath()
                ctx.arc(0, 0, 64, 0, TAU)
                ctx.fill()
                ctx.fillStyle = INK
                ctx.textAlign = 'center'
                ctx.textBaseline = 'middle'
                ctx.font = `900 76px ${R.DISPLAY}`
                ctx.fillText(`×${n}`, 0, 4)
                ctx.restore()
              }
              api.impact(t - T_SAME, 540, 986, 0.6)
            },
          }
        },
      })
    </script>
  </body>
</html>
