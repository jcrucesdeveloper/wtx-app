<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WTX — who finishes leg day first? (Three.js loop)</title>
    <!-- The marble-race format: four plates race, the viewer picks one, and the
         one training with a partner wins. Clay pastels on a checked cloth.
         ?lang=es for Spanish, ?loops=2 for two loops. Stage and controls: kit.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="kit.js"></script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const R = window.Reel
      const { seg, lerp, pulse, inOut, clamp01, TAU, W, H, DISPLAY, SANS } = R

      const D = 11
      const LEAD = 0.3
      const T_BACK = 10.2
      const X = [-1.5, -0.5, 0.5, 1.5]
      const Y0 = -1.7
      const Y1 = 1.05
      const RADIUS = 0.36
      /* How long each lane takes. Lane 2 has a partner and gets there first. */
      const TAKES = [7.9, 7.2, 8.4, 7.6]
      const WOBBLE = [
        [0.05, 2.0, 1.0],
        [-0.06, 1.5, 0.4],
        [0.08, 1.0, 0.2],
        [0.05, 2.5, 2.6],
      ]
      const WINNER = 1
      const T_WIN = TAKES[WINNER] - LEAD
      const CLAY = ['#e2725b', '#8fbf8f', '#b7a6e8', '#f2c14e']
      const CREAM = '#f6efe2'
      const COCOA = '#3b2f2f'

      R.run({
        THREE,
        RoomEnvironment,
        slug: 'race-day',
        duration: D,
        copy: {
          en: {
            hook: ['who finishes leg day first?', { t: 'pick one 👇', bg: COCOA, fg: CREAM }],
            win: ['2. always 2.', { t: 'the one with a gym partner', bg: CLAY[1], fg: COCOA }],
            plus: '+ ALEX',
          },
          es: {
            hook: ['¿quién termina pierna primero?', { t: 'elige uno 👇', bg: COCOA, fg: CREAM }],
            win: ['el 2. siempre el 2.', { t: 'el que entrena con su gym bro', bg: CLAY[1], fg: COCOA }],
            plus: '+ ALEX',
          },
        },
        build(api) {
          const { L, ctx, px, scene } = api
          /* Matte, like modelling clay. */
          const clay = (color) => new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0 })

          function disc(color, text, radius) {
            const group = new THREE.Group()
            const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.22, 64), clay(color))
            body.rotation.x = Math.PI / 2
            const front = api.face(radius * 2, radius * 2, (c, w) => {
              const r = w / 2
              c.translate(r, r)
              c.fillStyle = color
              c.beginPath()
              c.arc(0, 0, r, 0, TAU)
              c.fill()
              c.strokeStyle = 'rgba(59,47,47,0.22)'
              c.lineWidth = r * 0.09
              c.beginPath()
              c.arc(0, 0, r * 0.78, 0, TAU)
              c.stroke()
              c.fillStyle = COCOA
              c.textAlign = 'center'
              c.textBaseline = 'middle'
              c.font = `900 ${r * (text.length > 1 ? 0.5 : 1.0)}px ${DISPLAY}`
              c.fillText(text, 0, r * 0.06)
            })
            front.position.z = 0.112
            group.add(body, front)
            scene.add(group)
            return group
          }
          const racers = X.map((_, i) => disc(CLAY[i], `${i + 1}`, RADIUS))
          const partner = disc('#f4a6b7', '+1', 0.24)
          const crown = api.emoji('👑', 0.6)
          const burst = api.confetti(40, T_WIN, [X[WINNER], Y1, 0.5], 7, [...CLAY, '#f4a6b7', CREAM])

          /** 0 at the start line, 1 at the finish. */
          function progress(i, t) {
            if (t >= T_BACK && t < T_BACK + 0.5) return lerp(1, 0, inOut(seg(t, T_BACK, T_BACK + 0.45)))
            /* The race starts before the loop ends, so frame 1 is already moving. */
            const c = t >= T_BACK ? t - D + LEAD : t + LEAD
            const u = clamp01(c / TAKES[i])
            const [amp, freq, phase] = WOBBLE[i]
            return clamp01(u + amp * Math.sin(Math.PI * u) * Math.sin(u * freq * TAU + phase))
          }

          return {
            textStyle: 'caption',
            textY: 250,
            brand: { color: COCOA, alpha: 0.5 },
            texts: [
              { at: -1, until: T_WIN + 0.5, lines: L.hook },
              { at: T_WIN + 0.5, until: T_BACK, lines: L.win },
              { at: T_BACK + 0.35, until: 99, lines: L.hook },
            ],
            shakes: [[T_WIN, 22]],

            background(t) {
              ctx.fillStyle = CREAM
              ctx.fillRect(0, 0, W, H)
              /* A checked cloth, drifting one square per loop. */
              const size = 120
              const drift = (t / D) * size * 2
              ctx.fillStyle = 'rgba(226,114,91,0.13)'
              for (let j = -2; j < H / size + 2; j++)
                for (let i = -2; i < W / size + 2; i++)
                  if ((i + j) % 2 === 0) ctx.fillRect(i * size + drift, j * size + drift, size, size)

              const top = px(0, Y1 + RADIUS, 0)[1]
              const bottom = px(0, Y0 - RADIUS, 0)[1]
              X.forEach((x, i) => {
                const [cx] = px(x, 0, 0)
                ctx.fillStyle = 'rgba(59,47,47,0.1)'
                ctx.beginPath()
                ctx.roundRect(cx - 100, top - 26, 200, bottom - top + 52, 100)
                ctx.fill()
                ctx.fillStyle = CLAY[i]
                ctx.globalAlpha = 0.35
                ctx.beginPath()
                ctx.roundRect(cx - 100, top - 26, 200, bottom - top + 52, 100)
                ctx.fill()
                ctx.globalAlpha = 1
              })
              /* The finish line. */
              for (let i = 0; i < 24; i++)
                for (let j = 0; j < 2; j++) {
                  ctx.fillStyle = (i + j) % 2 ? COCOA : CREAM
                  ctx.fillRect(60 + i * 40, top - 50 + j * 24, 40, 24)
                }
            },

            pose(t) {
              racers.forEach((racer, i) => {
                const p = progress(i, t)
                const y = lerp(Y0, Y1, p)
                const won = i === WINNER ? pulse(t, T_WIN, 0.3) + 0.25 * Math.sin(Math.PI * seg(t, T_WIN, T_WIN + 0.5)) : 0
                racer.position.set(X[i], y + won, 0)
                racer.rotation.set(0, 0, -(y - Y0) / RADIUS)
                racer.scale.setScalar(1 + (i === WINNER ? pulse(t, T_WIN, 0.25) : pulse(t, TAKES[i] - LEAD, 0.08)))
              })
              /* The partner rolls just behind lane 2 the whole way. */
              const lead = racers[WINNER].position
              partner.position.set(lead.x + 0.34, lead.y - 0.5, 0.15)
              partner.rotation.set(0, 0, (lead.y - Y0) / 0.24)

              const up = seg(t, T_WIN + 0.1, T_WIN + 0.35) * (1 - seg(t, T_BACK - 0.2, T_BACK))
              crown.visible = up > 0
              crown.position.set(lead.x, lead.y + 0.42 + 0.05 * Math.sin(t * 6), 0.4)
              crown.scale.setScalar(crown.userData.size * R.outBack(up))
              burst(t)
            },

            over(t) {
              const [x, y] = px(X[WINNER] + 0.34, racers[WINNER].position.y - 0.92, 0.15)
              api.label(L.plus, x + 6, y, { size: 30, weight: 900, bg: COCOA, fg: CREAM, font: SANS })
              api.grain(t, 0.14)
            },
          }
        },
      })
    </script>
  </body>
</html>
