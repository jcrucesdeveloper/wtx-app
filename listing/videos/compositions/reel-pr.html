<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WTX reel — the PR</title>
    <!--
      TikTok / Reels / Shorts, 1080×1920, 18 s. Hook-first: the number is on
      screen in frame 1 (the first 3 s decide retention), the core action — a
      set logged in one tap — lands by 0:04, and every caption sits inside the
      shared safe zone (lib/reel.js).
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
    <style>
      .hook {
        position: absolute;
        left: 0;
        right: 0;
        top: 250px;
        height: 1000px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }
      .hook .num {
        font-size: 300px;
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 0.85;
      }
      .hook .num small {
        font-size: 0.3em;
        color: var(--text-1);
        margin-left: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as K from '../lib/kit.js'
      import { reelBase, reelPhone, caption, endCard, phoneOut } from '../lib/reel.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 18,
        clips: ['workout'],
        async build(ctx) {
          const { tl, el, m } = ctx
          const { world } = reelBase(ctx)

          ctx.music([
            { at: 0, bars: 7, part: 'drop' },
            { at: 14, bars: 2, part: 'outro' },
          ])
          ctx.sfx(0, 'impact', { gain: 0.8 })
          ctx.sfx(12, 'riser', { dur: 2, gain: 0.7 })

          /* ---------- 0:00 hook ---------- */
          const hook = el('div', 'hook')
          const pov = el('div', 'headline', hook, 'POV: you just hit a<br><em>bench PR</em>')
          Object.assign(pov.style, { fontSize: '96px', textAlign: 'center' })
          const povParts = K.rise(ctx, pov, 0.0, { stagger: 0.018, dur: 0.55 })
          const num = el('div', 'num', hook)
          const val = el('span', '', num)
          el('small', '', num, 'KG')
          K.counter(ctx, val, 60, 72.5, 0.15, 1.0, { decimals: 1, ease: 'expo.out' })
          K.slam(ctx, num, 0.1, { from: 1.7, sound: false })
          for (let i = 0; i < 10; i++) ctx.sfx(0.15 + i * 0.075 * (1 + i * 0.1), 'tick', { gain: 0.6 })
          const stamp = el('div', 'stamp', hook, 'New PR')
          stamp.style.position = 'relative'
          stamp.style.fontSize = '54px'
          tl.set(stamp, { opacity: 0 }, 0)
          tl.fromTo(stamp, { scale: 3, rotate: -24, opacity: 0 }, { scale: 1, rotate: -6, opacity: 1, duration: 0.35, ease: 'expo.out', immediateRender: false }, 1.0)
          ctx.sfx(1.0, 'hit')
          K.flash(ctx, 1.0, 0.4)
          K.shake(ctx, hook, 1.02, 18)
          K.riseOut(ctx, povParts, 1.75)
          tl.to([num, stamp], { opacity: 0, scale: 0.85, filter: 'blur(16px)', duration: 0.3, ease: 'power2.in' }, 1.75)

          /* ---------- 0:02 one tap ---------- */
          const ph = reelPhone(ctx, world, 'workout', { at: 1.95 })
          ctx.sfx(1.9, 'whoosh')
          const w = ph.view
          const seg1 = { at: 1.95, from: m('workout', 'weight') - 0.55, to: m('workout', 'set-2') + 0.1 }
          const t1 = K.playWithTaps(ctx, w, ph.viewport, seg1, { vw: ph.vw })
          const prAt = ctx.at(seg1, m('workout', 'pr-set'))
          ctx.sfx(prAt, 'confirm')
          ctx.sfx(ctx.at(seg1, m('workout', 'set-2')), 'confirm', { gain: 0.6 })
          caption(ctx, { at: 2.05, out: t1 - 0.3, kicker: 'Log the set', lines: ['Type it.', '<em>Tap it.</em>'] })

          const rowY = 548
          const co1 = K.callout(ctx, world, w, { x: 30, y: rowY, w: 826, h: 104 }, { x: 60, y: ph.sy(rowY) - 40, scale: 1.1 })
          K.popIn(ctx, co1, prAt - 0.02, { from: { scale: 0.7, y: 40, rotate: 0 }, sound: false })
          K.shake(ctx, co1, prAt + 0.05, 8)
          K.popOut(ctx, co1, prAt + 1.9)

          /* ---------- speed through the rest ---------- */
          const f0 = m('workout', 'set-2') + 0.1
          const f1 = m('workout', 'fast-end') + 0.1
          const t2 = K.playWithTaps(ctx, w, ph.viewport, { at: t1, from: f0, to: f1, speed: (f1 - f0) / 2.2 }, { vw: ph.vw, sound: false })
          for (let k = 0; k < 9; k++) ctx.sfx(t1 + k * 0.25, 'tap', { gain: 0.5 })
          caption(ctx, { at: t1, out: t2 - 0.3, kicker: 'Last time is pre-filled', lines: ['Every set,', '<em>one tap.</em>'] })

          /* ---------- finish ---------- */
          const g0 = m('workout', 'finish') - 0.25
          const g1 = m('workout', 'recap') - 0.5
          const t3 = K.playWithTaps(ctx, w, ph.viewport, { at: t2, from: g0, to: g1, speed: (g1 - g0) / 1.8 }, { vw: ph.vw })
          caption(ctx, { at: t2, out: t3 - 0.25, kicker: 'Done', lines: ['Finish &amp;', '<em>save.</em>'] })

          /* ---------- the recap, lifted out of the screen ---------- */
          // Stretch the still recap so the take's own scroll (recap + 2.6 s) never
          // starts: the callouts are cropped from fixed screen positions.
          const r0 = m('workout', 'recap') - 0.15
          const r1 = m('workout', 'recap') + 2.3
          K.playWithTaps(ctx, w, ph.viewport, { at: t3, from: r0, to: r1, speed: (r1 - r0) / (13.3 - t3) }, { vw: ph.vw })
          caption(ctx, { at: t3 + 0.05, out: 13.2, kicker: 'Automatic', lines: ['PRs. Streaks.', '<em>Milestones.</em>'], size: 104 })
          const prCard = K.callout(ctx, world, w, { x: 38, y: 316, w: 810, h: 138 }, { x: 40, y: 700, scale: 1.2 })
          K.popIn(ctx, prCard, t3 + 0.35, { sound: 'hit' })
          K.shake(ctx, prCard, t3 + 0.4, 8)
          const streak = K.callout(ctx, world, w, { x: 38, y: 592, w: 810, h: 180 }, { x: 60, y: 900, scale: 1.13 })
          K.popIn(ctx, streak, t3 + 1.05)
          const miles = K.callout(ctx, world, w, { x: 38, y: 790, w: 810, h: 88 }, { x: 60, y: 1130, scale: 1.13 })
          K.popIn(ctx, miles, t3 + 1.7)
          for (const c of [prCard, streak, miles]) K.popOut(ctx, c, 13.15)
          tl.to(ph.root, { filter: 'brightness(0.5) blur(3px)', duration: 0.4 }, t3 + 0.3)

          /* ---------- 0:14 end card ---------- */
          phoneOut(ctx, ph, 13.3)
          endCard(ctx, 14)
        },
      })
    </script>
  </body>
</html>
