<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v10 cópiala</title>
    <!--
      Variation 10: value first. The routine itself is on screen, readable,
      from frame 1 — something worth saving — and only then does the app show
      where it goes. The text on the card is exactly what the recording pastes.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 16,
        lang: 'es',
        clips: ['plaintext'],
        build(ctx) {
          const { m, el, tl } = ctx
          C.backdrop(ctx)
          const p = C.shot(ctx, 'plaintext')
          const band = C.topBand(ctx, 640)
          tl.set(band, { opacity: 0 }, 0)
          tl.set(band, { opacity: 1 }, 5.2)
          C.brandTag(ctx)
          ctx.music([
            { at: 0, bars: 3, part: 'break' },
            { at: 6, bars: 5, part: 'drive' },
          ])

          /* ---------- 0:00 the routine, to save ---------- */
          C.label(ctx, 'Rutina de torso en<br>3 ejercicios. Cópiala.', { y: 330, size: 60, out: 5.2 })
          const lines = ['# Upper Power', 'unit: kg', '', 'Bench Press | reps 5x5 | 75', 'Pullups | reps 4x8 | 0', 'Side Lateral Raise | reps 3x15 | 10']
          const card = el('div', 'code')
          Object.assign(card.style, { left: '60px', top: '560px', width: '960px', fontSize: '40px', zIndex: 25 })
          card.innerHTML =
            `<div class="bar"><i></i><i></i><i></i><span>upper-power.wtt</span></div>` +
            lines.map((l) => `<div class="code-line">${K.highlightWtt(l) || '&nbsp;'}</div>`).join('')
          tl.set(card, { opacity: 0 }, 5.2)
          // One line lights up at a time: something moves while it's being read.
          const rows = [...card.querySelectorAll('.code-line')].filter((_, i) => lines[i])
          rows.forEach((row, i) => {
            const t = 0.9 + i * 0.8
            tl.fromTo(row, { backgroundColor: 'rgba(224,38,58,0)' }, { backgroundColor: 'rgba(224,38,58,0.28)', duration: 0.15, immediateRender: false }, t)
            tl.to(row, { backgroundColor: 'rgba(224,38,58,0)', duration: 0.3 }, t + 0.65)
            ctx.sfx(t, 'tick', { gain: 0.5 })
          })

          /* ---------- 0:05 paste it ---------- */
          const typing = m('plaintext', 'typing')
          const typed = m('plaintext', 'typed')
          const add = m('plaintext', 'add')
          C.cut(ctx, [p], p, 5.2, C.frame({ x: 39, y: 738, w: 540, h: 246 }, { cy: 1120 }), { sound: 'hit' })
          const s1 = { at: 5.2, from: typing - 0.2, to: typed + 0.5, speed: (typed + 0.7 - typing) / 3.6 }
          C.play(ctx, p, s1, { sound: false })
          C.label(ctx, 'Pégala en WTX', { y: 330, size: 62, tone: 'red', at: 5.2, out: 8.8, sound: false })
          C.cam(ctx, p, 7.2, C.frame('parsed', { cy: 1260 }), { dur: 0.4 })
          C.label(ctx, 'la app la entiende sola', { y: 440, size: 42, tone: 'dark', at: 7.3, out: 8.8 })

          /* ---------- 0:08 it's in the library ---------- */
          C.cam(ctx, p, 8.8, C.under(660), { dur: 0.35 })
          const s2 = { at: 8.8, from: add - 0.3, to: add + 2.4, speed: 2.7 / 4 }
          C.play(ctx, p, s2)
          C.label(ctx, 'Lista para entrenar.', { y: 330, size: 62, at: ctx.at(s2, add) + 0.1, out: 12.8 })

          /* ---------- 0:12 the next one ---------- */
          C.cam(ctx, p, 12.8, C.under(660, 1.3), { dur: 3.2, ease: 'none', sound: false })
          C.label(ctx, 'Guárdala.<br>¿Te paso la de pierna?', { y: 330, size: 62, at: 12.8 })
        },
      })
    </script>
  </body>
</html>
