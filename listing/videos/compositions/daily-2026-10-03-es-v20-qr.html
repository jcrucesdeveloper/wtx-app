<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v20 no escanees este QR</title>
    <!--
      Variation 20, reverse psychology on a pattern interrupt: a QR code that
      fills the feed and a line telling you not to scan it. The code is the
      real one from the app's Share sheet, and it never moves, so it can be
      scanned from a paused video.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
    <style>
      .corner {
        position: absolute;
        width: 90px;
        height: 90px;
        box-sizing: border-box;
        border: 12px solid var(--signal);
        z-index: 25;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 8,
        lang: 'es',
        clips: ['routine'],
        build(ctx) {
          const { m, tl } = ctx
          const r = C.shot(ctx, 'routine')
          C.still(ctx, r, m('routine', 'qr') + 1.5)
          const CY = 980
          const view = C.frame('qr', { cy: CY, fill: 0.64 })
          C.cut(ctx, [r], r, 0, view)
          ctx.music([{ at: 0, bars: 4, part: 'intro' }])
          ctx.sfx(0, 'impact', { gain: 0.7 })
          for (const t of [2.56, 4.56]) ctx.sfx(t, 'whoosh', { gain: 0.5 })
          ctx.sfx(5.4, 'riser', { dur: 1, gain: 0.4 })

          /* ---------- a viewfinder around it, pulsing once a second ---------- */
          const half = (586 * view.scale) / 2 + 34
          const corners = [
            [-1, -1, { borderRight: 0, borderBottom: 0 }],
            [1, -1, { borderLeft: 0, borderBottom: 0 }],
            [-1, 1, { borderRight: 0, borderTop: 0 }],
            [1, 1, { borderLeft: 0, borderTop: 0 }],
          ].map(([sx, sy, borders]) => {
            const el = ctx.el('div', 'corner')
            Object.assign(el.style, borders, {
              left: 540 + sx * half - (sx > 0 ? 90 : 0) + 'px',
              top: CY + sy * half - (sy > 0 ? 90 : 0) + 'px',
            })
            return { el, sx, sy }
          })
          for (let t = 1; t < 8; t++) {
            corners.forEach(({ el, sx, sy }) => tl.fromTo(el, { x: sx * 26, y: sy * 26 }, { x: 0, y: 0, duration: 0.5, ease: 'expo.out', immediateRender: false }, t))
            ctx.sfx(t, 'tick', { gain: 0.7 })
          }

          /* ---------- the lines ---------- */
          C.label(ctx, 'No escanees<br>este QR.', { y: 320, size: 76, out: 2.6 })
          C.label(ctx, 'En serio.', { y: 320, size: 76, at: 2.6, out: 4.6 })
          C.label(ctx, 'Es mi rutina de push.', { y: 440, size: 56, tone: 'dark', at: 3.2, out: 4.6 })
          C.label(ctx, '5 ejercicios.', { y: 320, size: 76, at: 4.6, out: 6.4 })
          C.label(ctx, 'Se abre sin crear cuenta.', { y: 440, size: 52, tone: 'dark', at: 5.2, out: 6.4 })
          C.label(ctx, 'Bueno… escanéalo.', { y: 350, size: 76, tone: 'red', at: 6.4, sound: 'hit' })
          C.brandTag(ctx)
        },
      })
    </script>
  </body>
</html>
