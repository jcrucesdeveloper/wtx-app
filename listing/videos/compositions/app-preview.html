<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WTX App Store preview</title>
    <!--
      Apple App Preview — 886×1920 (every current iPhone size), 28 s (limit
      15–30), 30 fps. Apple's rules shape everything here:
        • screen capture of the app only — no device frame, no hands, no
          footage from outside the app; text overlays + touch hotspots allowed
        • it autoplays muted → short captions carry the story
        • no prices (the Config screen with the remove-ads price is never shown),
          no "free"/"new"/dates
        • the default poster frame is 0:05 — that moment is a logged set.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
    <style>
      .screen {
        position: absolute;
        left: 71px;
        top: 318px;
        width: 744px;
        height: 1612px;
        border-radius: 48px 48px 0 0;
        overflow: hidden;
        background: var(--app-bg);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1), 0 -20px 90px rgba(224, 38, 58, 0.25);
      }
      .screen .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 70px;
        height: 220px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
      .cap .headline {
        font-size: 72px;
        line-height: 0.98;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 886,
        height: 1920,
        fps: 30,
        duration: 28,
        clips: ['workout', 'history', 'plaintext', 'routine'],
        async build(ctx) {
          const { tl, el, m } = ctx
          K.background(ctx, { glows: 2 })
          ctx.music([
            { at: 0, bars: 7, part: 'drop' },
            { at: 14, bars: 2, part: 'break' },
            { at: 18, bars: 4, part: 'drop' },
            { at: 26, bars: 1, part: 'outro' },
          ])
          ctx.sfx(16, 'riser', { dur: 2, gain: 0.7 })

          const screen = el('div', 'screen')
          const vw = 744
          const layers = {}
          const layer = (name) => {
            if (!layers[name]) {
              layers[name] = ctx.view(name, screen)
              // Hidden until its first scene — set once, or a later re-entry would override earlier fades.
              tl.set(layers[name].img, { opacity: 0 }, 0)
            }
            return layers[name]
          }
          let current = null
          /** Plays a clip segment on screen, cross-fading from the previous clip. */
          function scene(name, at, from, to, dur) {
            const view = layer(name)
            if (current !== view) {
              tl.fromTo(view.img, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'none', immediateRender: false }, at)
              if (current) tl.to(current.img, { opacity: 0, duration: 0.2, ease: 'none' }, at + 0.2)
              current = view
            }
            // Keep the incoming layer on top of the outgoing one.
            tl.set(view.img, { zIndex: Math.round(at * 10) }, at)
            return K.playWithTaps(ctx, view, screen, { at, from, to, speed: (to - from) / dur }, { vw })
          }

          let capIdx = 0
          function cap(at, out, html) {
            const box = el('div', 'cap')
            const h = el('div', 'headline', box, html)
            const parts = K.rise(ctx, h, at + 0.05, { stagger: 0.015, dur: 0.55 })
            if (out) K.riseOut(ctx, parts, out - 0.3, { dur: 0.3 })
            capIdx++
          }

          // 0:00 start — 0:05 (poster frame) a set is logged
          const a0 = m('workout', 'start') - 0.9
          let t = scene('workout', 0, a0, m('workout', 'start') + 0.7, 1.6)
          cap(0, t, 'Start a routine<br><em>in one tap</em>')
          const b0 = m('workout', 'session') - 0.2
          const b1 = m('workout', 'bench-done')
          const tb = scene('workout', t, b0, b1, b1 - b0)
          cap(t, tb, 'Log every set<br><em>with a tap</em>')
          for (const n of [2, 3, 4]) ctx.sfx(t + (m('workout', `set-${n}`) - b0), 'confirm', { gain: 0.6 })
          ctx.sfx(t + (m('workout', 'pr-set') - b0), 'confirm')
          t = tb

          // rest timer + the remaining sets
          const tc = scene('workout', t, m('workout', 'bench-done') + 0.2, m('workout', 'fast-end') + 0.2, 2.5)
          cap(t, tc, 'Rest timer<br><em>built in</em>')
          t = tc

          // finish → saved
          const td = scene('workout', t, m('workout', 'finish') - 0.3, m('workout', 'recap') - 0.5, 2.0)
          cap(t, td, 'Review,<br><em>then save</em>')
          t = td

          // recap (held before the take's own scroll)
          const te = scene('workout', t, m('workout', 'recap') - 0.15, m('workout', 'recap') + 2.3, 14.4 - t)
          cap(t, te, 'PRs and streaks,<br><em>automatically</em>')
          t = te

          // history
          const h0 = m('history', 'sessions-tab') - 0.2
          const tf = scene('history', t, h0, h0 + 3.6, 4.0)
          cap(t, tf, 'Every workout<br><em>on a calendar</em>')
          t = tf

          // plain text
          const p0 = m('plaintext', 'textarea') - 0.3
          const tg = scene('plaintext', t, p0, m('plaintext', 'added') + 1.0, 4.8)
          cap(t, tg, 'Routines are<br><em>plain text</em>')
          t = tg

          // share
          const tq = scene('routine', t, m('routine', 'share') - 0.5, m('routine', 'qr') + 1.6, 26.4 - t)
          cap(t, tq, 'Share a routine<br><em>with a QR code</em>')
          t = tq

          // close on the recap
          scene('workout', t, m('workout', 'recap') + 0.3, m('workout', 'recap') + 1.0, 28 - t)
          cap(t, null, 'Log every set.<br><em>Beat every PR.</em>')
          ctx.sfx(t, 'hit', { gain: 0.6 })
        },
      })
    </script>
  </body>
</html>
