<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v15 elige tu color</title>
    <!--
      Variation 15, "pick one": the same screen four times in a 2×2 grid, each
      in a different accent colour and numbered. Then each one full screen as
      it is tapped, and back to the grid for the question.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
    <style>
      .num {
        position: absolute;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        color: #0b0d0f;
        font-weight: 900;
        font-size: 62px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        z-index: 28;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 10,
        lang: 'es',
        clips: ['accent'],
        build(ctx) {
          const { m, tl } = ctx
          C.backdrop(ctx)
          ctx.music([{ at: 0, bars: 5, part: 'drive' }])
          ctx.sfx(0, 'impact', { gain: 0.7 })

          const colors = [
            { marker: 'swatch-1', name: 'Esmeralda' },
            { marker: 'swatch-3', name: 'Violeta' },
            { marker: 'swatch-5', name: 'Ámbar' },
            { marker: 'swatch-6', name: 'Cian' },
          ]

          /* ---------- the grid ---------- */
          const W = 435
          const H = 600
          const cells = colors.map((c, i) => {
            const x = 90 + (i % 2) * (W + 30)
            const y = 500 + Math.floor(i / 2) * (H + 30)
            const p = C.pane(ctx, 'accent', { x, y, w: W, h: H, radius: 24 })
            C.still(ctx, p, m('accent', c.marker) + 0.75)
            gsap.set(p.cam, C.frameIn(p, 'accent-cards', { cy: 0.5 }))
            const n = ctx.el('div', 'num', ctx.stage, String(i + 1))
            Object.assign(n.style, { left: x + W / 2 - 48 + 'px', top: y + H / 2 - 48 + 'px' })
            // One after another, so the eye goes round the grid.
            const t = 0.7 + i * 0.4
            tl.fromTo([p.root, n], { scale: 1.08 }, { scale: 1, duration: 0.3, ease: 'expo.out', immediateRender: false }, t)
            ctx.sfx(t, 'tick', { gain: 0.9 })
            return { p, n }
          })
          const grid = cells.flatMap((c) => [c.p.root, c.n])
          C.label(ctx, 'Elige el color<br>de tu app de gym', { y: 290, size: 62, out: 2.4 })

          /* ---------- 0:02 each one, tapped for real ---------- */
          const s = C.shot(ctx, 'accent')
          tl.set(s.root, { zIndex: 26 }, 0)
          const band = C.topBand(ctx, 560)
          band.style.zIndex = 27
          tl.set(band, { opacity: 0 }, 0)
          tl.set(band, { opacity: 1 }, 2.4)
          tl.set(band, { opacity: 0 }, 7.2)
          colors.forEach((c, i) => {
            const at = 2.4 + i * 1.2
            const tap = m('accent', c.marker)
            C.cut(ctx, [s], s, at, C.under(570), { sound: false })
            C.play(ctx, s, { at, from: tap - 0.25, to: tap + 0.95, speed: 1 })
            tl.fromTo(s.root, { scale: 1.05 }, { scale: 1, duration: 0.25, ease: 'expo.out', immediateRender: false }, at)
            C.bigNumber(ctx, String(i + 1), { at, out: at + 1.2, y: 262, size: 240, sound: 'hit' }).style.zIndex = 40
            C.label(ctx, c.name, { y: 330, x: 300, size: 66, at: at + 0.1, out: at + 1.2, sound: false, z: 40 })
          })

          /* ---------- 0:07 back to the grid: the question ---------- */
          tl.set(grid, { opacity: 0 }, 2.4)
          tl.set(grid, { opacity: 1 }, 7.2)
          tl.set(s.root, { opacity: 0 }, 7.2)
          ctx.sfx(7.2, 'hit', { gain: 0.8 })
          C.label(ctx, '¿1, 2, 3 o 4?', { y: 300, size: 96, at: 7.2, sound: false })
          cells.forEach(({ n }, i) => {
            tl.fromTo(n, { scale: 1.5 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, 7.6 + i * 0.5)
            ctx.sfx(7.6 + i * 0.5, 'pop', { gain: 0.7 })
          })
          C.brandTag(ctx, { y: 1790 }).style.zIndex = 20
        },
      })
    </script>
  </body>
</html>
