<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v08 el mes en números</title>
    <!--
      Variation 8: a "wrapped"-style recap. One big number every ~2.5 s, each
      over the real screen that shows it.

      The big figures are typed here and MUST equal what the recording shows
      behind them (11 workouts in the month, 5 698 kg, +20 kg, 9 weeks, 72.5
      kg). After re-recording the takes, check a contact sheet and update them.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 16,
        lang: 'es',
        clips: ['workout', 'history'],
        build(ctx) {
          const { m } = ctx
          const h = C.shot(ctx, 'history')
          const r = C.shot(ctx, 'workout')
          const shots = [h, r]
          C.topBand(ctx, 790)
          C.brandTag(ctx)
          C.progressBar(ctx, { y: 226 })
          ctx.music([{ at: 0, bars: 8, part: 'drop' }])
          ctx.sfx(0, 'impact', { gain: 0.8 })

          const month = { from: m('history', 'prev-month') + 0.5, to: m('history', 'next-month') - 0.1 }
          const recap = m('workout', 'recap')
          C.play(ctx, h, { at: 0, ...month, speed: (month.to - month.from) / 5 }, { sound: false })
          C.play(ctx, r, { at: 5, from: recap + 0.3, to: recap + 2.3, speed: 2 / 11 }, { sound: false })

          /* ---------- 0:00 hook ---------- */
          C.cut(ctx, shots, h, 0, C.under(800))
          C.label(ctx, 'Mi mes en el gym,<br>en números', { y: 330, size: 66, out: 2.2 })

          const stat = (at, out, number, unit, text) => {
            C.bigNumber(ctx, number, { at, out, y: 330, size: 250, unit })
            C.label(ctx, text, { y: 610, size: 52, tone: 'red', at: at + 0.12, out, sound: false })
          }

          /* ---------- the month ---------- */
          stat(2.2, 5, '11', '', 'entrenamientos en el mes')
          C.cam(ctx, h, 2.2, C.frame('calendar', { cy: 1290 }))

          /* ---------- today's volume ---------- */
          stat(5, 7.6, '5 698', 'kg', 'de volumen en un día')
          C.cut(ctx, shots, r, 5, C.frame('recap-stats', { cy: 1080, fill: 1 }), { sound: false })
          K.flash(ctx, 5, 0.25)

          /* ---------- vs last time ---------- */
          stat(7.6, 10, '+20', 'kg', 'más que la última vez')
          C.cam(ctx, r, 7.6, C.frame('recap-volume', { cy: 1080, fill: 1 }))

          /* ---------- the streak ---------- */
          stat(10, 12.4, '9', '', 'semanas seguidas')
          C.cam(ctx, r, 10, C.frame('recap-streak', { cy: 1120, fill: 1 }))

          /* ---------- the record ---------- */
          stat(12.4, 14.6, '72.5', 'kg', 'nuevo récord en press de banca')
          C.cam(ctx, r, 12.4, C.frame('recap-pr', { cy: 1100, fill: 1 }))
          K.flash(ctx, 12.4, 0.45)
          C.punch(ctx, r, 12.4, 1.08)

          /* ---------- the question ---------- */
          C.cam(ctx, r, 14.6, C.frame('recap-top', { cy: 1390 }), { dur: 0.45 })
          C.label(ctx, '¿Y tu mes<br>cómo va?', { y: 330, size: 84, at: 14.6 })
        },
      })
    </script>
  </body>
</html>
