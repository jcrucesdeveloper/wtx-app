<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v05 satisfying</title>
    <!--
      Variation 5: close-up, no music, no captions to read. The camera follows
      every recorded tap while a counter climbs to 16/16; it ends on the
      finished workout and loops. Played at 1× so the sounds match the taps.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 12,
        lang: 'es',
        clips: ['workout'],
        build(ctx) {
          const { m } = ctx
          const w = C.shot(ctx, 'workout')
          const r = C.shot(ctx, 'workout')
          const shots = [w, r]
          C.topBand(ctx, 670)
          C.brandTag(ctx)
          C.label(ctx, 'El sonido de terminar<br>tu rutina', { y: 330, size: 56, out: 10.5 })

          const from = m('workout', 'pr-set') - 0.5
          const to = m('workout', 'fast-end') + 0.45
          const END = 10.5
          const seg = { at: 0, from, to, speed: (to - from) / END }
          // Right edge of the app on the right edge of the frame; only the height follows the tap.
          const follow = (tap) => ({ scale: 1.3, x: 1080 - C.CLIP_W * 1.3, y: 1230 - tap.y * 1.3 })
          const taps = ctx.taps('workout', from, to).filter((t) => /^(pr-set|set-\d+)$/.test(t.label))

          C.cut(ctx, shots, w, 0, follow(taps[0]))
          C.play(ctx, w, seg, { sound: false })
          // The camera glides to each tap just before it lands.
          taps.forEach((tap, i) => {
            const t = ctx.at(seg, tap.t)
            if (i > 0) C.cam(ctx, w, Math.max(0, t - 0.22), follow(tap), { dur: 0.2, ease: 'power2.out', sound: false })
            ctx.sfx(t, 'tap', { gain: 0.9 })
            ctx.sfx(t + 0.03, 'confirm', { gain: 0.55 + 0.03 * i })
          })
          const times = [0, ...taps.map((tap) => ctx.at(seg, tap.t))]
          C.steps(ctx, taps.map((_, i) => `${i}<small>/16</small>`).concat(['16<small>/16</small>']), times, { y: 530, size: 84, out: END })

          /* ---------- done ---------- */
          C.cut(ctx, shots, r, END, C.frame('recap-top', { cy: 1300 }), { sound: 'hit' })
          C.play(ctx, r, { at: END, from: m('workout', 'recap') + 0.3, to: m('workout', 'recap') + 1.8, speed: 1 }, { sound: false })
          K.flash(ctx, END, 0.4)
          C.punch(ctx, r, END, 1.08)
          ctx.sfx(END + 0.05, 'plate', { gain: 0.9 })
          C.label(ctx, '16/16. Listo.', { y: 330, size: 64, tone: 'red', at: END, sound: false })
        },
      })
    </script>
  </body>
</html>
