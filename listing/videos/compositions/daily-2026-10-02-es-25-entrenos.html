<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX reel — 25 entrenos después</title>
    <!-- Spanish daily reel, story tone. Spec shape: _daily-template.html. Guide: .claude/skills/daily-reel/SKILL.md -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import { dailyReel } from '../lib/daily.js'

      const SPEC = {
        lang: 'es',
        // Quiet build through the hook, drop on the first reveal.
        tone: 'story',
        duration: 22,
        hook: {
          dur: 4,
          kicker: 'POV',
          lines: ['8 semanas', 'anotando', 'cada <em>serie.</em>'],
          size: 96,
          number: { from: 0, to: 25, suffix: 'ENTRENOS' },
        },
        beats: [
          {
            // The previous month: the current one is nearly empty early in a month.
            clip: 'history', from: ['prev-month', 0.3], to: ['next-month', -0.1], dur: 3,
            kicker: 'El mes pasado', lines: ['Un mes', '<em>completo.</em>'],
          },
          {
            // The session list, scrolling past each workout's volume change.
            clip: 'history', from: ['calendar', 2.3], to: ['calendar', 4.2], dur: 3.2,
            kicker: 'Sesión a sesión', lines: ['Siempre un', 'poco <em>más.</em>'],
          },
          {
            clip: 'workout', from: ['bench-done', 0], to: ['fast-end', 0.1], dur: 2.6,
            kicker: 'Hoy', lines: ['Push Day.', '<em>Otra vez.</em>'], tapSound: false,
          },
          {
            clip: 'workout', from: ['recap', -0.15], to: ['recap', 2.3], dur: 4.5,
            kicker: 'Y entonces', lines: ['25', '<em>entrenos.</em>'],
            callouts: ['recap-milestone', 'recap-pr'],
          },
        ],
        end: { tagline: 'Anota hoy.<br><span class="accent">Mira el progreso.</span>', pill: 'wtxworkout.com' },
      }

      const clips = [...new Set(SPEC.beats.map((b) => b.clip))]
      composition({ width: 1080, height: 1920, fps: 30, duration: SPEC.duration, clips, lang: SPEC.lang, build: (ctx) => dailyReel(ctx, SPEC) })
    </script>
  </body>
</html>
