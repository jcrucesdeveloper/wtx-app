<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WTX daily reel</title>
    <!--
      DAILY REEL TEMPLATE — copy to compositions/daily-YYYY-MM-DD-<slug>.html,
      edit SPEC, then:  node scripts/render.mjs daily-YYYY-MM-DD-<slug>
      Output: out/daily/<name>.mp4 (+ no-music/…-sfx-only.mp4). 1080×1920, 30 fps.
      Full guide: .claude/skills/daily-reel/SKILL.md
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import { dailyReel } from '../lib/daily.js'

      const SPEC = {
        // 'en' | 'es': which recorded takes to use (build/clips or build/clips-es)
        // and the language of the built-in text. Write the captions in it too.
        lang: 'en',
        // hype | clean | tutorial | story  (see TONES in lib/daily.js)
        tone: 'tutorial',
        // Even number of seconds, 12–30. The last 4 s are the end card.
        duration: 18,
        // false → no soundtrack (voice + sound design only).
        music: true,
        // Optional voice-over (any audio format, path relative to listing/videos/).
        // Time captions to it with: node scripts/voice.mjs phrases <file>
        voice: { file: 'assets/voice/example-draft.wav', at: 0.3 },

        // 0 → hook.dur: the first 3 s decide retention. Say the payoff, not the logo.
        hook: {
          dur: 3,
          kicker: 'How I log a workout',
          lines: ['Log a workout', 'in <em>20 seconds.</em>'],
          // optional: number: { from: 60, to: 72.5, decimals: 1, suffix: 'KG' }, stamp: 'New PR',
          // optional: code: '# Push Day\nBench Press | reps 4x8 | 60', codeFile: 'push-day.wtt',
        },

        // Real app footage, in order. from/to: 'marker' | ['marker', offsetSeconds] | seconds.
        // dur: seconds on screen (beats are scaled to fill hook → phone exit exactly).
        // callouts: named crops of real UI popped out of the screen (RECTS in lib/daily.js).
        // confirms: [['marker', offset]] extra "set done" chimes.
        beats: [
          { clip: 'workout', from: ['start', -0.8], to: ['start', 0.9], dur: 2.1, kicker: 'Pick a routine', lines: ['Start it.'] },
          {
            clip: 'workout', from: ['session', -0.2], to: 'bench-done', dur: 3.9,
            kicker: 'Last time is pre-filled', lines: ['Tap each', '<em>set.</em>'],
            confirms: [['pr-set'], ['set-2'], ['set-3'], ['set-4']],
          },
          { clip: 'workout', from: ['finish', -0.3], to: ['recap', -0.4], dur: 1.8, kicker: 'Done', lines: ['Finish.'] },
          {
            clip: 'workout', from: ['recap', -0.15], to: ['recap', 2.3], dur: 2.5,
            kicker: 'Automatic', lines: ['New PR,', '<em>spotted.</em>'],
            callouts: ['recap-pr', 'recap-streak'],
          },
        ],

        // End card tagline (HTML). Omit for the default "Log every set. Beat every PR."
        // pill: the CTA under it. Omit for "Free on iOS & Android"; before the
        // stores are live use the web address, e.g. pill: 'wtxworkout.com'.
        end: { tagline: 'Twenty seconds.<br><span class="accent">Every workout.</span>' },
      }

      const clips = [...new Set(SPEC.beats.map((b) => b.clip))]
      composition({ width: 1080, height: 1920, fps: 30, duration: SPEC.duration, clips, lang: SPEC.lang, build: (ctx) => dailyReel(ctx, SPEC) })
    </script>
  </body>
</html>
