<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v01 speedrun</title>
    <!--
      Variation 1 (listing/research/08-hooks-and-retention.md): a stopwatch as
      the open loop. The take plays at exactly 1×, so the time on screen is the
      real time from tapping "Iniciar rutina" to "Terminar y guardar".
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 22,
        lang: 'es',
        clips: ['workout'],
        build(ctx) {
          const { m } = ctx
          const w = C.shot(ctx, 'workout')
          const WIDE = C.under(770, 1.12)

          // 1× from just before the first tap to the finished recap.
          const from = m('workout', 'start') - 0.5
          const seg = { at: 0, from, to: from + 22, speed: 1 }
          const tStart = ctx.at(seg, m('workout', 'start'))
          const tSession = ctx.at(seg, m('workout', 'session'))
          const tWeight = ctx.at(seg, m('workout', 'weight'))
          const tPr = ctx.at(seg, m('workout', 'pr-set'))
          const tBench = ctx.at(seg, m('workout', 'bench-done'))
          const tFinish = ctx.at(seg, m('workout', 'finish'))
          const tConfirm = ctx.at(seg, m('workout', 'confirm'))
          const tRecap = ctx.at(seg, m('workout', 'recap'))

          C.cut(ctx, [w], w, 0, C.under(780))
          C.topBand(ctx, 750)
          C.play(ctx, w, seg)
          ctx.music([{ at: 0, bars: 11, part: 'drive' }])
          for (let t = Math.ceil(tStart); t < tConfirm; t++) ctx.sfx(t, 'tick', { gain: 0.22 })

          C.brandTag(ctx)
          C.label(ctx, 'Speedrun: registrar un<br>entreno completo', { y: 330, size: 58, out: tRecap - 0.2 })
          C.stopwatch(ctx, { at: tStart, until: tConfirm, y: 530, size: 116 })

          // Camera: the app's own "Vamos" intro centred, into the first exercise,
          // onto the weight being typed, back out.
          C.cam(ctx, w, tStart + 0.2, C.under(250), { dur: 0.35, sound: false })
          C.cam(ctx, w, tSession - 0.1, C.frame('session-card', { cy: 1300 }), { dur: 0.45 })
          C.cam(ctx, w, tWeight - 0.1, C.frame({ x: 60, y: 500, w: 560, h: 380 }, { cy: 1250 }))
          C.cam(ctx, w, tPr + 0.35, C.frame('session-card', { cy: 1300 }))
          C.cam(ctx, w, tBench + 0.1, WIDE, { dur: 0.4 })
          C.cam(ctx, w, tFinish - 0.3, C.under(760), { dur: 0.4 })

          C.label(ctx, 'la última vez ya viene puesta', { y: 668, size: 40, tone: 'dark', at: tPr + 0.6, out: tBench + 0.1 })
          C.label(ctx, 'un toque por serie', { y: 668, size: 40, tone: 'dark', at: tBench + 1.6, out: tFinish - 0.4 })

          // Stopped. The recap is the payoff; the question earns the comment.
          C.cam(ctx, w, tRecap - 0.25, C.frame('recap-top', { cy: 1340 }), { dur: 0.4 })
          C.punch(ctx, w, tRecap)
          C.label(ctx, '16 series registradas.', { y: 330, size: 58, tone: 'red', at: tRecap - 0.2 })
          C.label(ctx, '¿Y tú cuánto tardas?', { y: 432, size: 58, at: tRecap + 0.5 })
        },
      })
    </script>
  </body>
</html>
