<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX reel — no rompas la racha</title>
    <!-- Spanish daily reel. Spec shape: _daily-template.html. Guide: .claude/skills/daily-reel/SKILL.md -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import { dailyReel } from '../lib/daily.js'

      const SPEC = {
        lang: 'es',
        tone: 'hype',
        duration: 18,
        hook: { dur: 3, kicker: 'Semana tras semana', lines: ['No rompas', 'la <em>racha.</em>'] },
        beats: [
          {
            // The previous month: the current one is nearly empty early in a month.
            clip: 'history', from: ['prev-month', 0.4], to: ['next-month', -0.1], dur: 3,
            kicker: 'Tu calendario', lines: ['Cada día', '<em>cuenta.</em>'],
          },
          {
            clip: 'workout', from: ['bench-done', 0], to: ['fast-end', 0.1], dur: 2.6,
            kicker: 'Registra rápido', lines: ['Entrena.', '<em>Anótalo.</em>'], tapSound: false,
          },
          {
            clip: 'workout', from: ['recap', -0.15], to: ['recap', 2.3], dur: 4.7,
            kicker: 'Automático', lines: ['Y mira cómo', '<em>suma.</em>'], size: 100,
            callouts: ['recap-streak', 'recap-milestone'],
          },
        ],
        end: { tagline: 'Entrena. Anótalo.<br><span class="accent">Mira cómo suma.</span>', pill: 'wtxworkout.com' },
      }

      const clips = [...new Set(SPEC.beats.map((b) => b.clip))]
      composition({ width: 1080, height: 1920, fps: 30, duration: SPEC.duration, clips, lang: SPEC.lang, build: (ctx) => dailyReel(ctx, SPEC) })
    </script>
  </body>
</html>
