<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v07 chat</title>
    <!--
      Variation 7: a text conversation between two gym friends (a generic chat,
      no real app's look), answered by the real import screen. Built to be
      sent to the friend who keeps asking for your routine.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 16,
        lang: 'es',
        clips: ['import'],
        build(ctx) {
          const { m } = ctx
          C.backdrop(ctx)
          const imp = C.shot(ctx, 'import')
          const band = C.topBand(ctx, 620)
          ctx.tl.set(band, { opacity: 0 }, 0)
          ctx.tl.set(band, { opacity: 1 }, 6.4)
          C.brandTag(ctx)
          ctx.music([{ at: 0, bars: 8, part: 'drive' }])

          /* ---------- 0:00 the conversation ---------- */
          C.chat(
            ctx,
            [
              { from: 'them', text: 'bro pásame tu rutina de push', at: 0 },
              { from: 'me', text: 'va', at: 1.1 },
              { from: 'them', text: '¿tengo que crear cuenta o algo?', at: 2.1 },
              { from: 'me', text: 'nop, abre el link', at: 3.4 },
              { from: 'me', text: 'wtxworkout.com/<wbr>import?r=…', at: 4.4 },
              { from: 'them', text: '¿así nomás?', at: 5.4 },
            ],
            { y: 350, out: 6.4, size: 66 },
          )

          /* ---------- 0:06 the link opens ---------- */
          const opened = m('import', 'opened')
          const add = m('import', 'add')
          C.cut(ctx, [imp], imp, 6.4, C.under(640), { sound: 'hit' })
          const seg = { at: 6.4, from: opened + 0.3, to: add + 2.4, speed: (add + 2.4 - opened - 0.3) / 6.2 }
          C.play(ctx, imp, seg)
          const tAdd = ctx.at(seg, add)
          C.label(ctx, 'Abre el link…', { y: 330, size: 62, at: 6.4, out: tAdd, sound: false })
          C.label(ctx, '…y ya está en su app.', { y: 330, size: 62, tone: 'red', at: tAdd, out: 12.8 })
          C.punch(ctx, imp, tAdd + 0.05, 1.04)
          C.label(ctx, 'sin cuenta · sin copiar a mano', { y: 450, size: 42, tone: 'dark', at: tAdd + 0.9, out: 12.8 })

          /* ---------- 0:12 who would you send it to ---------- */
          C.cam(ctx, imp, 12.8, C.under(640, 1.3), { dur: 3.2, ease: 'none', sound: false })
          C.label(ctx, '¿A quién le pasarías<br>tu rutina?', { y: 330, size: 62, at: 12.8 })
        },
      })
    </script>
  </body>
</html>
