<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v06 adivina</title>
    <!--
      Variation 6: a guess. The viewer is asked a question the footage will
      answer, a 3-2-1 holds them, the app's own record banner is the reveal,
      and the closing question is one they can answer in a comment.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 12,
        lang: 'es',
        clips: ['workout'],
        build(ctx) {
          const { m } = ctx
          const w = C.shot(ctx, 'workout')
          const r = C.shot(ctx, 'workout')
          const shots = [w, r]
          C.topBand(ctx, 720)
          C.brandTag(ctx)
          ctx.music([
            { at: 0, bars: 3, part: 'build' },
            { at: 6, bars: 3, part: 'drop' },
          ])

          const weight = m('workout', 'weight')
          const pr = m('workout', 'pr-set')
          const ROW = C.frame({ x: 39, y: 500, w: 560, h: 380 }, { cy: 1290 })

          /* ---------- 0:00 the question, while the weight is typed ---------- */
          C.cut(ctx, shots, w, 0, ROW)
          C.play(ctx, w, { at: 0, from: weight - 0.5, to: pr - 0.12, speed: (pr - 0.12 - weight + 0.5) / 3.6 })
          C.label(ctx, '¿Récord o no?<br>Adivina antes que la app.', { y: 330, size: 58, out: 6 })
          C.label(ctx, 'La última vez: 70 kg × 8', { y: 530, size: 44, tone: 'dark', at: 0.8, out: 6 })

          /* ---------- 0:03 hold ---------- */
          C.scrim(ctx, 3.6, 5.4, 0.6)
          const go = C.countdown(ctx, { at: 3.6, per: 0.6, y: 900 })
          ctx.sfx(4.0, 'riser', { dur: 2, gain: 0.7 })

          /* ---------- 0:05 the set is logged, the app answers ---------- */
          C.play(ctx, w, { at: go, from: pr - 0.12, to: pr + 0.5, speed: 1 })
          C.cut(ctx, shots, r, 6, C.frame('recap-pr', { cy: 1120, fill: 1 }), { sound: 'hit' })
          C.play(ctx, r, { at: 6, from: m('workout', 'recap') + 0.2, to: m('workout', 'recap') + 2.3, speed: 2.1 / 6 }, { sound: false })
          ctx.sfx(6, 'impact', { gain: 0.9 })
          K.flash(ctx, 6, 0.5)
          C.punch(ctx, r, 6, 1.1)
          C.label(ctx, 'Récord.', { y: 330, size: 96, tone: 'red', at: 6, out: 9, sound: false })
          C.label(ctx, '72.5 kg. Antes: 70.', { y: 500, size: 52, at: 6.7, out: 9 })

          /* ---------- 0:09 the question that earns a comment ---------- */
          C.cam(ctx, r, 9, C.frame('recap-top', { cy: 1330 }), { dur: 0.45 })
          C.label(ctx, '¿Cuál es tu récord<br>en press de banca?', { y: 330, size: 62, at: 9 })
        },
      })
    </script>
  </body>
</html>
