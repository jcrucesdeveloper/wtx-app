<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v02 deja de anotar en Notas</title>
    <!--
      Variation 2: a negative hook over a messy note, struck through, then
      three fast proof cuts with a punch-in each. No end card: it closes on a
      question.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 14,
        lang: 'es',
        clips: ['workout', 'history'],
        build(ctx) {
          const { m } = ctx
          C.backdrop(ctx)
          const w = C.shot(ctx, 'workout')
          const r = C.shot(ctx, 'workout')
          const h = C.shot(ctx, 'history')
          const shots = [w, r, h]
          const band = C.topBand(ctx, 700)
          ctx.tl.set(band, { opacity: 0 }, 0)
          ctx.tl.set(band, { opacity: 1 }, 2.4)

          ctx.music([{ at: 0, bars: 7, part: 'drop' }])
          ctx.sfx(0, 'impact', { gain: 0.8 })
          C.brandTag(ctx)

          /* ---------- 0:00 the note everyone has ---------- */
          C.label(ctx, 'Deja de anotar tus pesos<br>en Notas.', { y: 330, size: 60, out: 2.4 })
          const note = C.notes(
            ctx,
            ['banca 70x8 ?? o 72.5', 'press hombro 40… creo', '<s>pierna: mañana</s>', 'racha: ni idea'],
            { y: 600, out: 2.4, title: 'gym' },
          )
          ctx.tl.fromTo(note, { rotate: -2 }, { rotate: 1.5, duration: 2.4, ease: 'none' }, 0)
          C.strike(ctx, note, 1.35)
          K.shake(ctx, note, 1.4, 12)

          /* ---------- 0:02 it remembers ---------- */
          C.cut(ctx, shots, w, 2.4, C.frame('session-card', { cy: 1290 }), { sound: 'hit' })
          C.label(ctx, '1. Se acuerda de<br>tu última vez', { y: 330, size: 60, tone: 'red', at: 2.4, out: 5.6, sound: false })
          const s1 = { at: 2.4, from: m('workout', 'session') + 0.2, to: m('workout', 'bench-done'), speed: (m('workout', 'bench-done') - m('workout', 'session') - 0.2) / 3.2 }
          C.play(ctx, w, s1)
          C.cam(ctx, w, 3.5, C.frame({ x: 39, y: 520, w: 520, h: 360 }, { cy: 1290 }))

          /* ---------- 0:05 it spots the record ---------- */
          C.cut(ctx, shots, r, 5.6, C.frame('recap-top', { cy: 1330 }), { sound: 'hit' })
          C.label(ctx, '2. Te avisa cuando<br>rompes un récord', { y: 330, size: 60, tone: 'red', at: 5.6, out: 8.4, sound: false })
          C.play(ctx, r, { at: 5.6, from: m('workout', 'recap') + 0.2, to: m('workout', 'recap') + 2.3, speed: 2.1 / 5.6 }, { sound: false })
          C.cam(ctx, r, 6.4, C.frame('recap-pr', { cy: 1100, fill: 1 }))
          K.flash(ctx, 6.4, 0.35)

          /* ---------- 0:08 it counts the streak ---------- */
          C.label(ctx, '3. Lleva tu racha<br>sin que cuentes', { y: 330, size: 60, tone: 'red', at: 8.4, out: 11.2 })
          C.cam(ctx, r, 8.4, C.frame('recap-streak', { cy: 1100, fill: 1 }))

          /* ---------- 0:11 the month, then the question ---------- */
          C.cut(ctx, shots, h, 11.2, C.frame('calendar', { cy: 1230 }), { sound: 'hit' })
          C.play(ctx, h, { at: 11.2, from: m('history', 'prev-month') + 0.5, to: m('history', 'next-month') - 0.1, speed: 0.3 }, { sound: false })
          C.label(ctx, 'Tus Notas no hacen esto.', { y: 330, size: 60, at: 11.2, sound: false })
          C.label(ctx, '¿Sigues en Notas?', { y: 440, size: 60, tone: 'red', at: 12.3 })
          ctx.tl.fromTo(h.cam, { scale: '+=0' }, { scale: '+=0.06', duration: 2.8, ease: 'none', immediateRender: false }, 11.2)
        },
      })
    </script>
  </body>
</html>
