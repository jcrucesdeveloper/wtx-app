<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX reel — registra en 20 segundos</title>
    <!-- Spanish daily reel. Spec shape: _daily-template.html. Guide: .claude/skills/daily-reel/SKILL.md -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import { dailyReel } from '../lib/daily.js'

      const SPEC = {
        lang: 'es',
        tone: 'tutorial',
        duration: 18,
        hook: {
          dur: 3,
          kicker: 'Así registro mi entrenamiento',
          lines: ['Registra tu', 'entreno en', '<em>20 segundos.</em>'],
          size: 84,
        },
        beats: [
          { clip: 'workout', from: ['start', -0.8], to: ['start', 0.9], dur: 2.1, kicker: 'Elige una rutina', lines: ['Iníciala.'] },
          {
            clip: 'workout', from: ['session', -0.2], to: 'bench-done', dur: 3.9,
            kicker: 'Ya viene rellenado', lines: ['Toca cada', '<em>serie.</em>'],
            confirms: [['pr-set'], ['set-2'], ['set-3'], ['set-4']],
          },
          { clip: 'workout', from: ['finish', -0.3], to: ['recap', -0.4], dur: 1.8, kicker: 'Listo', lines: ['Termina.'] },
          {
            clip: 'workout', from: ['recap', -0.15], to: ['recap', 2.3], dur: 2.5,
            kicker: 'Automático', lines: ['Nuevo récord,', '<em>detectado.</em>'], size: 88,
            callouts: ['recap-pr', 'recap-streak'],
          },
        ],
        end: { tagline: 'Veinte segundos.<br><span class="accent">Cada entrenamiento.</span>', pill: 'wtxworkout.com' },
      }

      const clips = [...new Set(SPEC.beats.map((b) => b.clip))]
      composition({ width: 1080, height: 1920, fps: 30, duration: SPEC.duration, clips, lang: SPEC.lang, build: (ctx) => dailyReel(ctx, SPEC) })
    </script>
  </body>
</html>
