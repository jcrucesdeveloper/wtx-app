<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v19 nadie habla de esto</title>
    <!--
      Variation 19, the curiosity gap ("nobody is talking about…"): the first
      frame is an extreme close-up of something small. The video is one
      zoom-out, in three steps, until you see what it is and what it does.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 12,
        lang: 'es',
        clips: ['workout'],
        build(ctx) {
          const { m, tl } = ctx
          const w = C.shot(ctx, 'workout')
          C.brandTag(ctx)
          ctx.music([
            { at: 0, bars: 1, part: 'break' },
            { at: 2, bars: 5, part: 'drive' },
          ])
          ctx.sfx(0, 'riser', { dur: 2.4, gain: 0.45 })

          const first = m('workout', 'pr-set')
          const set2 = m('workout', 'set-2')
          const done = m('workout', 'bench-done')

          /* ---------- 0:00 macro: what is this? ---------- */
          const macro = C.at({ x: 150, y: 1748 }, { cy: 1020, scale: 3.6 })
          C.cut(ctx, [w], w, 0, macro)
          C.play(ctx, w, { at: 0, from: first + 0.5, to: set2 - 0.15, speed: (set2 - first - 0.65) / 4.8 }, { sound: false })
          tl.to(w.cam, { x: macro.x - 60, duration: 2.4, ease: 'none' }, 0)
          C.label(ctx, 'Nadie habla de esto<br>en las apps de gym:', { y: 330, size: 62, out: 2.4 })

          /* ---------- 0:02 it is the rest timer ---------- */
          C.cam(ctx, w, 2.4, C.frame('rest-bar', { cy: 1020, fill: 1 }), { dur: 0.5 })
          ctx.sfx(2.4, 'hit', { gain: 0.8 })
          C.label(ctx, 'el descanso.', { y: 330, size: 84, tone: 'red', at: 2.4, out: 4.8, sound: false })
          C.label(ctx, 'Aparece solo.', { y: 480, size: 62, at: 3.3, out: 4.8 })

          /* ---------- 0:04 why: ticking a set brings it up ---------- */
          C.cam(ctx, w, 4.8, C.full(345), { dur: 0.5 })
          const ticks = { at: 4.8, from: set2 - 0.15, to: done + 0.4, speed: (done - set2 + 0.55) / 3 }
          C.play(ctx, w, ticks)
          C.label(ctx, 'Marcas la serie ✓', { y: 330, size: 62, at: 4.8, out: 7.8, sound: false })
          C.label(ctx, 'y tu descanso ya está: 1:30', { y: 440, size: 52, tone: 'red', at: 5.4, out: 7.8 })

          /* ---------- 0:07 and you stay in charge ---------- */
          C.cam(ctx, w, 7.8, C.frame({ x: 500, y: 1695, w: 386, h: 105 }, { cy: 1020, fill: 0.96, maxScale: 3 }))
          C.punch(ctx, w, 7.8, 1.05)
          C.label(ctx, '¿Te falta aire? <em>+15 s</em>', { y: 330, size: 60, at: 7.8, out: 10 })
          C.label(ctx, '¿Vas sobrado? <em>Saltar</em>', { y: 440, size: 60, at: 8.7, out: 10 })

          /* ---------- 0:10 the question ---------- */
          C.cam(ctx, w, 10, C.frame('rest-bar', { cy: 1020, fill: 1 }), { dur: 0.45 })
          K.flash(ctx, 10, 0.2)
          C.label(ctx, '¿Cuánto descansas<br>entre series?', { y: 320, size: 76, at: 10 })
        },
      })
    </script>
  </body>
</html>
