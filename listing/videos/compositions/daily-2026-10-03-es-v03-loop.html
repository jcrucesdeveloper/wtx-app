<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v03 six-second loop</title>
    <!--
      Variation 3: the 6-second fade-in. One image, slowly pushing in, under a
      list that takes longer to read than the video lasts — so it loops, and a
      loop counts as watch time over 100%.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 6,
        lang: 'es',
        clips: ['workout'],
        build(ctx) {
          const { m, tl } = ctx
          const r = C.shot(ctx, 'workout')
          const start = C.frame('recap-top', { cy: 1500, fill: 0.9 })
          C.cut(ctx, [r], r, 0, start)
          // A still moment of the finish screen (before the take scrolls).
          C.play(ctx, r, { at: 0, from: m('workout', 'recap') + 1.2, to: m('workout', 'recap') + 2.2, speed: 1 / 6 }, { sound: false })
          tl.to(r.cam, { scale: start.scale * 1.07, x: start.x - 36, y: start.y - 40, duration: 6, ease: 'none' }, 0)
          C.topBand(ctx, 1020)
          C.fadeFromBlack(ctx, 1.4)
          ctx.music([{ at: 0, bars: 3, part: 'break' }])
          // Sound design of its own, so the cut without music isn't silent.
          ctx.sfx(0, 'riser', { dur: 1.4, gain: 0.5 })
          ctx.sfx(1.4, 'pop', { gain: 0.6 })
          for (let i = 0; i < 6; i++) ctx.sfx(1.9 + i * 0.62, 'tick', { gain: 0.35 })

          // Above the fade, so the hook is readable on the black first frame.
          const z = 80
          C.label(ctx, 'Cosas que mi app de gym<br>hace sola:', { y: 262, size: 60, z })
          const items = [
            '1. Pone el peso de la última vez',
            '2. Detecta mis récords',
            '3. Cuenta mi racha semanal',
            '4. Compara con la sesión anterior',
            '5. Cronometra el descanso',
            '6. Me recuerda entrenar',
          ]
          items.forEach((text, i) => C.label(ctx, text, { y: 470 + i * 86, size: 42, tone: i === 1 ? 'red' : 'dark', z }))
        },
      })
    </script>
  </body>
</html>
