<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v09 opinión impopular</title>
    <!--
      Variation 9: an unpopular opinion, typed out word by word at speaking
      pace, then three fast cuts that argue it. Ends on a question people
      disagree about.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 14,
        lang: 'es',
        clips: ['workout'],
        build(ctx) {
          const { m } = ctx
          C.backdrop(ctx)
          const w = C.shot(ctx, 'workout')
          const r = C.shot(ctx, 'workout')
          const shots = [w, r]
          const band = C.topBand(ctx, 720)
          ctx.tl.set(band, { opacity: 0 }, 0)
          ctx.tl.set(band, { opacity: 1 }, 3.6)
          C.brandTag(ctx)
          ctx.music([
            { at: 0, bars: 2, part: 'build' },
            { at: 4, bars: 5, part: 'drop' },
          ])

          /* ---------- 0:00 the opinion ---------- */
          C.words(ctx, 'Opinión impopular: tu app de gym *no* necesita *IA.*', { at: 0, per: 0.24, y: 420, size: 132, first: 2, out: 3.6 })

          /* ---------- 0:03 what it needs ---------- */
          const session = m('workout', 'session')
          const bench = m('workout', 'bench-done')
          const fastEnd = m('workout', 'fast-end')
          const head = (text, at, out) => C.label(ctx, text, { y: 330, size: 58, tone: 'red', at, out, sound: false })
          ctx.sfx(3.6, 'impact', { gain: 0.8 })

          C.cut(ctx, shots, w, 3.6, C.frame({ x: 39, y: 500, w: 560, h: 380 }, { cy: 1290 }))
          C.play(ctx, w, { at: 3.6, from: session + 0.2, to: bench, speed: (bench - session - 0.2) / 3 })
          C.label(ctx, 'Necesita 3 cosas:', { y: 250 + 88, size: 58, at: 3.6, out: 4.6, sound: false })
          head('1. Acordarse de lo<br>que levantaste', 4.6, 6.6)

          C.cut(ctx, shots, w, 6.6, C.under(770, 1.12), { sound: 'hit' })
          C.play(ctx, w, { at: 6.6, from: bench, to: fastEnd + 0.2, speed: (fastEnd + 0.2 - bench) / 3 })
          head('2. Un toque<br>por serie', 6.6, 9.6)

          C.cut(ctx, shots, r, 9.6, C.frame('recap-pr', { cy: 1120, fill: 1 }), { sound: 'hit' })
          C.play(ctx, r, { at: 9.6, from: m('workout', 'recap') + 0.3, to: m('workout', 'recap') + 2.3, speed: 2 / 4.4 }, { sound: false })
          K.flash(ctx, 9.6, 0.35)
          head('3. Decirte<br>cuando mejoras', 9.6, 12.4)
          C.cam(ctx, r, 11, C.frame('recap-volume', { cy: 1120, fill: 1 }))

          /* ---------- 0:12 the question ---------- */
          C.cam(ctx, r, 12.4, C.frame('recap-top', { cy: 1330 }), { dur: 0.45 })
          C.label(ctx, '¿De acuerdo<br>o me equivoco?', { y: 330, size: 70, at: 12.4 })
        },
      })
    </script>
  </body>
</html>
