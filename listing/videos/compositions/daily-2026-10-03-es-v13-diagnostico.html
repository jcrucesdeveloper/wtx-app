<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WTX — v13 diagnóstico</title>
    <!--
      Variation 13, the diagnosis ("here is why your X is not working"): a
      checklist of three problems that stays on screen. Below it, a window of
      the app answers them one at a time, and each ✗ flips to a ✓.
    -->
    <link rel="stylesheet" href="../lib/motion.css" />
    <style>
      .item {
        position: absolute;
        left: 90px;
        width: 810px;
        display: flex;
        align-items: center;
        gap: 26px;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: -0.02em;
        color: #fff;
        z-index: 30;
      }
      .item__box {
        position: relative;
        flex: none;
        width: 78px;
        height: 78px;
        border-radius: 18px;
        background: #2a3038;
      }
      .item__box b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 18px;
        font-size: 54px;
        font-weight: 900;
      }
      .item__box .no {
        background: #2a3038;
        color: #ff5468;
      }
      .item__box .yes {
        background: #1faa62;
        color: #fff;
      }
      .item__text {
        position: relative;
      }
      .item__text i {
        position: absolute;
        left: -6px;
        right: -6px;
        top: 52%;
        height: 6px;
        border-radius: 3px;
        background: #1faa62;
        transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script type="module">
      import { composition } from '../lib/engine.js'
      import * as C from '../lib/cuts.js'
      import * as K from '../lib/kit.js'

      composition({
        width: 1080,
        height: 1920,
        fps: 30,
        duration: 14,
        lang: 'es',
        clips: ['workout', 'history'],
        build(ctx) {
          const { m, tl } = ctx
          C.backdrop(ctx)
          C.brandTag(ctx)
          ctx.music([
            { at: 0, bars: 2, part: 'break' },
            { at: 4, bars: 5, part: 'drive' },
          ])
          ctx.sfx(0, 'impact', { gain: 0.7 })

          C.label(ctx, 'Por esto sientes que<br>no progresas en el gym:', { y: 320, size: 58 })

          /* ---------- the checklist: problems first ---------- */
          const item = (text, y, at) => {
            const el = ctx.el('div', 'item')
            el.style.top = y + 'px'
            const box = ctx.el('div', 'item__box', el)
            const no = ctx.el('b', 'no', box, '✗')
            const yes = ctx.el('b', 'yes', box, '✓')
            const label = ctx.el('span', 'item__text', el, text)
            const line = ctx.el('i', '', label)
            tl.set(yes, { opacity: 0 }, 0)
            tl.set(line, { scaleX: 0 }, 0)
            C.appear(ctx, el, at, { from: { x: -60 }, dur: 0.22, ease: 'expo.out', sound: 'hit' })
            return { el, no, yes, line, box }
          }
          const items = [
            item('No anotas tus pesos', 540, 0.9),
            item('No sabes si hoy fue mejor', 650, 1.8),
            item('No ves tu constancia', 760, 2.7),
          ]
          const fix = (it, at) => {
            tl.set(it.yes, { opacity: 1 }, at)
            tl.fromTo(it.box, { scale: 1.5 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, at)
            tl.to(it.line, { scaleX: 1, duration: 0.25, ease: 'expo.out' }, at)
            tl.to(it.el, { color: '#74818f', duration: 0.2 }, at)
            ctx.sfx(at, 'confirm', { gain: 0.8 })
          }

          /* ---------- 0:04 the window that answers them ---------- */
          const box = { x: 90, y: 900, w: 900, h: 660 }
          const sets = C.pane(ctx, 'workout', box)
          const recap = C.pane(ctx, 'workout', box)
          const month = C.pane(ctx, 'history', box)
          const panes = [sets, recap, month]
          const show = (p, at) => panes.forEach((q) => tl.set(q.root, { opacity: q === p ? 1 : 0 }, at))
          panes.forEach((p) => tl.set(p.root, { opacity: 0 }, 0))

          // 1. Every set, one tap.
          show(sets, 4)
          tl.fromTo(sets.root, { y: 500 }, { y: 0, duration: 0.4, ease: 'expo.out', immediateRender: false }, 4)
          ctx.sfx(3.96, 'whoosh', { gain: 0.6 })
          gsap.set(sets.cam, C.frameIn(sets, 'session-card', { cy: 0.56 }))
          const s1 = { at: 4, from: m('workout', 'weight') - 0.4, to: m('workout', 'bench-done') + 0.2, speed: (m('workout', 'bench-done') - m('workout', 'weight') + 0.6) / 3.2 }
          C.play(ctx, sets, s1)
          fix(items[0], ctx.at(s1, m('workout', 'set-2')))

          // 2. Today against last time.
          show(recap, 7.2)
          ctx.sfx(7.2, 'hit', { gain: 0.7 })
          C.still(ctx, recap, m('workout', 'recap') + 1.4, 7.2)
          gsap.set(recap.cam, C.frameIn(recap, { x: 38, y: 300, w: 810, h: 290 }, { fill: 1.0 }))
          tl.fromTo(recap.root, { scale: 1.06 }, { scale: 1, duration: 0.3, ease: 'expo.out', immediateRender: false }, 7.2)
          fix(items[1], 8)

          // 3. The month at a glance.
          show(month, 10)
          ctx.sfx(10, 'hit', { gain: 0.7 })
          C.still(ctx, month, m('history', 'prev-month') + 0.9, 10)
          gsap.set(month.cam, C.frameIn(month, 'calendar', { fill: 1.0 }))
          tl.fromTo(month.root, { scale: 1.06 }, { scale: 1, duration: 0.3, ease: 'expo.out', immediateRender: false }, 10)
          fix(items[2], 10.8)
          K.flash(ctx, 10.8, 0.2)

          /* ---------- 0:12 the question ---------- */
          C.label(ctx, '¿Cuál de las 3 te falta?', { y: 1160, size: 62, tone: 'red', align: 'center', at: 12.2, z: 40 })
          tl.to(month.root, { opacity: 0.35, duration: 0.2 }, 12.2)
        },
      })
    </script>
  </body>
</html>
