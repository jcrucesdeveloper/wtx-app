<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Local-first</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1920px;
      }
      .canvas {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Local-first</div>
        <div class="headline">Nothing leaves your <em>phone</em>.</div>
        <div class="subhead">No account. No login. No cloud. Export or wipe your data anytime.</div>
        <div class="art">
          <div class="device" style="width: 47cqw; aspect-ratio: 480 / 1040;">
            <img src="../screens/02-local-first.png" alt="" />
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100">
            <g fill="#fff6ef">
              <rect x="24" y="47" width="52" height="6" rx="3" />
              <rect x="13" y="31" width="10" height="38" rx="3.5" />
              <rect x="77" y="31" width="10" height="38" rx="3.5" />
            </g>
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
