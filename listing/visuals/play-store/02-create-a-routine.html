<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Create a routine</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1920px;
      }
      .canvas {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Create a routine</div>
        <div class="headline">Build a routine in <em>seconds</em>.</div>
        <div class="subhead">
          A simple form that serializes straight to valid, portable .wtt
          text — no fuss.
        </div>
        <div class="art">
          <div class="card form-mock">
            <div class="field">
              <div class="label">Exercise</div>
              <div class="input">Bench Press</div>
            </div>
            <div class="field-row">
              <div class="field">
                <div class="label">Sets × Reps</div>
                <div class="input">4 × 8</div>
              </div>
              <div class="field">
                <div class="label">Weight</div>
                <div class="input">60 kg</div>
              </div>
            </div>
            <div class="field">
              <div class="label">Rest</div>
              <div class="input">1m 30s</div>
            </div>
            <div class="field">
              <div class="label">Muscle group</div>
              <div class="chip-row">
                <span class="chip active">Chest</span>
                <span class="chip">Shoulders</span>
                <span class="chip">Triceps</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
