<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — The .wtt format</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1920px;
      }
      .canvas {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>The .wtt format</div>
        <div class="headline">It's just <em>text</em>.</div>
        <div class="subhead">
          Readable, editable, versionable — like any other text file.
        </div>
        <div class="art">
          <div class="code-block"><span class="c-punc"># </span><span class="c-name">Push Day</span><br /><span class="c-key">unit</span><span class="c-punc">: </span>kg<br /><span class="c-key">tags</span><span class="c-punc">: </span>strength, upper<br /><br />Bench Press&nbsp;&nbsp;&nbsp;<span class="c-punc">| </span>reps 4x8<span class="c-punc"> | </span>60<span class="c-punc"> | </span>rest 1m30s<br />Overhead Press <span class="c-punc">| </span>reps 3x10<span class="c-punc"> | </span>30</div>
          <div class="arrow-down">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </div>
          <div class="parsed-summary">
            <div class="stat"><b>2</b><span>Exercises</span></div>
            <div class="div"></div>
            <div class="stat"><b>7</b><span>Sets</span></div>
            <div class="div"></div>
            <div class="stat"><b>Chest</b><span>Muscle group</span></div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
