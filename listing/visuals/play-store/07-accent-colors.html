<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Accent colors</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1920px;
      }
      .canvas {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Personalize</div>
        <div class="headline">Make it <em>yours</em>.</div>
        <div class="subhead">
          Pick an accent color and WTX remembers it, everywhere, every visit.
        </div>
        <div class="art">
          <div class="swatch-stage">
            <div class="swatch-dot selected" style="background: var(--c-emerald)">
              <span class="check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
            </div>
            <div class="swatch-dot" style="background: var(--c-blue)"></div>
            <div class="swatch-dot" style="background: var(--c-violet)"></div>
            <div class="swatch-dot" style="background: var(--c-rose)"></div>
            <div class="swatch-dot" style="background: var(--c-amber)"></div>
            <div class="swatch-dot" style="background: var(--c-cyan)"></div>
            <div class="swatch-dot" style="background: var(--c-lime)"></div>
            <div class="swatch-dot" style="background: var(--c-slate)"></div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
