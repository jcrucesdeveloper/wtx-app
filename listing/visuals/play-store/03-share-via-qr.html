<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Share via QR</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1920px;
      }
      .canvas {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Share via QR</div>
        <div class="headline">Share it with a <em>scan</em>.</div>
        <div class="subhead">A real, scannable QR code for every routine. No account needed on either end.</div>
        <div class="art">
          <div class="device" style="width: 78cqw; aspect-ratio: 466 / 679;">
            <img src="../screens/03-share-qr.png" alt="" />
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100">
            <g fill="#fff6ef">
              <rect x="24" y="47" width="52" height="6" rx="3" />
              <rect x="13" y="31" width="10" height="38" rx="3.5" />
              <rect x="77" y="31" width="10" height="38" rx="3.5" />
            </g>
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
