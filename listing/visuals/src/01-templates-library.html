<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Templates library</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
      .canvas {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Templates library</div>
        <div class="headline">Your routines, as <em>text files</em> you own.</div>
        <div class="subhead">
          Every routine you add is parsed into a clean summary — exercises,
          sets, and muscle groups, at a glance.
        </div>
        <div class="art">
          <div class="card-stack">
            <div class="routine-card hi">
              <div class="swatch" style="background: var(--c-emerald)"></div>
              <div class="meta">
                <div class="name">Push Day</div>
                <div class="sub"><span>6 exercises</span><span>18 sets</span></div>
              </div>
              <div class="tags">
                <span class="tag-chip">Chest</span>
                <span class="tag-chip">Shoulders</span>
              </div>
            </div>
            <div class="routine-card">
              <div class="swatch" style="background: var(--c-blue)"></div>
              <div class="meta">
                <div class="name">Pull Day</div>
                <div class="sub"><span>5 exercises</span><span>15 sets</span></div>
              </div>
              <div class="tags">
                <span class="tag-chip">Back</span>
              </div>
            </div>
            <div class="routine-card">
              <div class="swatch" style="background: var(--c-violet)"></div>
              <div class="meta">
                <div class="name">Leg Day</div>
                <div class="sub"><span>7 exercises</span><span>21 sets</span></div>
              </div>
              <div class="tags">
                <span class="tag-chip">Legs</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
