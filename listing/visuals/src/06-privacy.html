<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Privacy</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
      .canvas {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Privacy by default</div>
        <div class="headline">Nothing leaves your <em>phone</em>.</div>
        <div class="subhead">
          No account. No cloud sync. No server WTX controls.
        </div>
        <div class="art">
          <div class="privacy-stage">
            <div class="shield">
              <svg viewBox="0 0 100 100" fill="none">
                <path
                  d="M50 6 L88 20 V48 C88 72 72 88 50 96 C28 88 12 72 12 48 V20 Z"
                  fill="var(--accent-soft)"
                  stroke="var(--accent-2)"
                  stroke-width="3"
                />
                <path
                  d="M34 51 L45 63 L68 37"
                  stroke="#f6f8fa"
                  stroke-width="7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
              </svg>
            </div>
          </div>
          <div class="privacy-points">
            <div class="privacy-point">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              No sign-up, ever
            </div>
            <div class="privacy-point">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Routines stored locally, on-device
            </div>
            <div class="privacy-point">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Your data is yours to move or delete
            </div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
