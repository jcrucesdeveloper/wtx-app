<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Load a routine</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
      .canvas {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Load a routine</div>
        <div class="headline">Paste it, pick it, <em>or scan it</em>.</div>
        <div class="subhead">
          Three ways to bring a routine into WTX — whatever's easiest in the
          moment.
        </div>
        <div class="art">
          <div class="three-pack">
            <div class="method-row">
              <div class="icon-chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
              </div>
              <div class="txt">
                <div class="t">Paste .wtt text</div>
                <div class="d">Straight from a message, a doc, or a coach's note</div>
              </div>
            </div>
            <div class="method-row">
              <div class="icon-chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                  <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
              </div>
              <div class="txt">
                <div class="t">Pick a file</div>
                <div class="d">Any .wtt file already on your device</div>
              </div>
            </div>
            <div class="method-row">
              <div class="icon-chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 7l-7 5 7 5V7z"></path>
                  <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
              </div>
              <div class="txt">
                <div class="t">Scan a QR code</div>
                <div class="d">With your camera, or from a saved image</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
