<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX — Routine detail</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
      .canvas {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame">
        <div class="eyebrow"><span class="dot"></span>Push Day</div>
        <div class="headline">Every set, <em>at a glance</em>.</div>
        <div class="subhead">
          Exercises, sets and reps, rest, and target muscle — laid out
          exactly as your .wtt file describes it.
        </div>
        <div class="art">
          <div class="exercise-list">
            <div class="exercise-row">
              <div class="num">1</div>
              <div class="name">Bench Press</div>
              <div class="stat">4×8 · 60kg</div>
            </div>
            <div class="exercise-row">
              <div class="num">2</div>
              <div class="name">Overhead Press</div>
              <div class="stat">3×10 · 30kg</div>
            </div>
            <div class="exercise-row">
              <div class="num">3</div>
              <div class="name">Incline Dumbbell Press</div>
              <div class="stat">3×12 · 22kg</div>
            </div>
            <div class="exercise-row">
              <div class="num">4</div>
              <div class="name">Plank</div>
              <div class="stat">1m 30s</div>
            </div>
          </div>
        </div>
      </div>
      <div class="wordmark">
        <span class="mark">
          <svg viewBox="0 0 100 100" fill="none">
            <polyline
              points="17,23 32,79 50,47 68,79 83,23"
              stroke="#f8fffb"
              stroke-width="12.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        WTX
      </div>
    </div>
  </body>
</html>
