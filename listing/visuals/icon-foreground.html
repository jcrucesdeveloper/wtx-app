<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX Adaptive Icon Foreground — transparent, safe-zone sized</title>
    <style>
      html,
      body {
        width: 432px;
        height: 432px;
        background: transparent;
      }

      .fg {
        width: 432px;
        height: 432px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Android adaptive-icon safe zone is the inner 66/108 (~61%) circle.
         48% keeps the mark clear of it on every launcher mask shape. */
      .fg svg {
        width: 48%;
        height: 48%;
      }
    </style>
  </head>
  <body>
    <div class="fg">
      <svg viewBox="0 0 100 100">
        <g fill="#e0263a">
          <rect x="24" y="47" width="52" height="6" rx="3" />
          <rect x="13" y="31" width="10" height="38" rx="3.5" />
          <rect x="77" y="31" width="10" height="38" rx="3.5" />
        </g>
      </svg>
    </div>
  </body>
</html>
