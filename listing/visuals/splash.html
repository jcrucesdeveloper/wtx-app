<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WTX Splash Screen — rendered per target size</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        background: #181818;
      }

      .splash {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Sized off the smaller viewport axis so the mark stays centered and
         at a consistent visual scale across portrait/landscape/square
         renders, and survives safe-area cropping on any device. */
      .splash svg {
        width: 32vmin;
        height: 32vmin;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <svg viewBox="0 0 100 100">
        <g fill="#e0263a">
          <rect x="24" y="47" width="52" height="6" rx="3" />
          <rect x="13" y="31" width="10" height="38" rx="3.5" />
          <rect x="77" y="31" width="10" height="38" rx="3.5" />
        </g>
      </svg>
    </div>
  </body>
</html>
