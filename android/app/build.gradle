import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Version: package.json is the single source of truth. versionName is its
// "version" (X.Y.Z) and versionCode is derived from it, so it always grows
// with the version: X * 1,000,000 + Y * 10,000 + Z * 100 + build. `build`
// (0-99, default 0) is the `buildNumber` Gradle property, only for uploading
// the same version again (-PbuildNumber=1). Y and Z must stay below 100.
def appVersionName = new JsonSlurper().parse(rootProject.file('../package.json')).version
def appVersionParts = appVersionName.tokenize('.')*.toInteger()
def appBuildNumber = (project.findProperty('buildNumber') ?: '0').toInteger()
if (appVersionParts.size() != 3 || appVersionParts[1] > 99 || appVersionParts[2] > 99 || appBuildNumber > 99) {
    throw new GradleException("Can't derive versionCode from version ${appVersionName} and buildNumber ${appBuildNumber}: expected X.Y.Z with Y, Z and buildNumber at most 99.")
}
def appVersionCode = appVersionParts[0] * 1_000_000 + appVersionParts[1] * 10_000 + appVersionParts[2] * 100 + appBuildNumber

// Release signing: reads android/keystore.properties (gitignored) when it
// exists; without it the release build is left unsigned.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// AdMob App ID. The ad unit IDs live in the repo's .env files (Vite), but
// the App ID is native, so it's read here: the `admobAppId` Gradle property,
// then the ADMOB_APP_ID_ANDROID env var, then ADMOB_APP_ID_ANDROID in
// ../.env.production.local / ../.env.local (one place for all ad config).
// Without one, Google's public sample App ID is used, and a real ad unit
// never fills under it — so a release build with Android ads on fails here
// instead of shipping an app that silently shows no ads.
def SAMPLE_ADMOB_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def readDotEnv = { String name ->
    def values = [:]
    def file = rootProject.file("../${name}")
    if (file.exists()) {
        file.eachLine { line ->
            def m = line =~ /^\s*([A-Z0-9_]+)\s*=\s*"?([^"#]*?)"?\s*$/
            if (m.matches()) values[m.group(1)] = m.group(2)
        }
    }
    values
}
def dotEnv = readDotEnv('.env.local') + readDotEnv('.env.production.local')
def admobAppId = project.findProperty('admobAppId') ?:
    System.getenv('ADMOB_APP_ID_ANDROID') ?:
    dotEnv['ADMOB_APP_ID_ANDROID'] ?:
    SAMPLE_ADMOB_APP_ID
def buildsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (buildsRelease && dotEnv['VITE_ADS_ANDROID'] == 'true' && admobAppId == SAMPLE_ADMOB_APP_ID) {
    throw new GradleException("Android ads are on (VITE_ADS_ANDROID=true) but no AdMob App ID is set, so no ad would ever load. Add ADMOB_APP_ID_ANDROID=ca-app-pub-...~... (AdMob -> Apps -> App settings) to .env.production.local.")
}

android {
    namespace = "com.wtxworkout.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wtxworkout.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AdMob App ID injected into AndroidManifest.xml; see `admobAppId` above.
        manifestPlaceholders["admobAppId"] = admobAppId
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // Host of VITE_PUBLIC_URL, for the App Links intent filter in
        // AndroidManifest.xml. Override with the `publicHost` Gradle property
        // (-PpublicHost=...) or the WTX_PUBLIC_HOST env var, e.g. for a staging host.
        manifestPlaceholders["publicHost"] = project.findProperty('publicHost') ?:
            System.getenv('WTX_PUBLIC_HOST') ?:
            'wtxworkout.com'
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
